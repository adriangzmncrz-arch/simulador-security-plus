,"type":"single","difficulty":2,"stem":"Durante la selección de un proveedor de MSSP, una integrante del comité evaluador revela que su esposo es ejecutivo de ventas de uno de los licitantes. ¿Cuál es la MEJOR acción?","options":["Permitir que continúe si firma un NDA con el licitante","Descalificar automáticamente al licitante relacionado","Pedir al licitante un descuento a cambio de la relación","Documentar la declaración y excluirla de la evaluación de ese proceso"],"answer":[3],"explanation":"Ante un conflict of interest, la práctica recomendada es divulgarlo, documentarlo y apartar (recusar) a la persona involucrada para preservar la imparcialidad. Descalificar al proveedor es desproporcionado, un NDA no elimina el conflicto y pedir un descuento lo agravaría."},{"id":"D5-029","domain":5,"objective":"5.3","type":"multi","difficulty":2,"stem":"Un proveedor SaaS no permite que sus clientes ejecuten pruebas de penetración contra su plataforma. ¿Cuáles de los siguientes elementos puede solicitar el cliente para obtener garantía sobre los controles del proveedor? (Elige DOS.)","options":["Un memorandum of understanding (MOU) firmado","La acceptable use policy del propio cliente","Un reporte SOC 2 Type II emitido por un auditor independiente","El whitepaper de marketing del proveedor","Evidencia de las auditorías internas del proveedor y sus planes de remediación"],"answer":[2,4],"explanation":"Las evaluaciones independientes (como un SOC 2 Type II) y la evidencia de auditorías internas son métodos de vendor assessment que demuestran la operación de los controles. Un MOU solo expresa intención, el material de marketing no es evidencia verificable y la AUP del cliente no describe los controles del proveedor."},{"id":"D5-030","domain":5,"objective":"5.3","type":"single","difficulty":3,"stem":"El equipo de seguridad quiere realizar una prueba de penetración contra una aplicación alojada por un proveedor que se integra con la red interna de la empresa. ¿Qué debe hacer PRIMERO?","options":["Obtener autorización por escrito del proveedor y acordar las rules of engagement","Ejecutar un escaneo no autenticado para delimitar el alcance","Notificar a los clientes del proveedor sobre la prueba","Realizar reconocimiento pasivo y después reconocimiento activo"],"answer":[0],"explanation":"Probar sistemas de un tercero sin permiso puede ser ilegal; antes de cualquier actividad se requiere autorización escrita y rules of engagement que definan alcance, horarios, técnicas permitidas y contactos. Escanear o hacer reconocimiento activo sin autorización ya es parte de la prueba, y notificar a los clientes del proveedor no corresponde a la empresa."},{"id":"D5-031","domain":5,"objective":"5.3","type":"single","difficulty":2,"stem":"En el tercer año de un contrato, la empresa descubre que su proveedor de nómina cambió de proveedor de hosting sin avisar. ¿Qué práctica habría detectado este cambio con MAYOR probabilidad?","options":["La due diligence realizada durante la selección del proveedor","Vendor monitoring continuo, incluidos cuestionarios y revisiones periódicas","El NDA firmado al inicio de la relación","El statement of work (SOW) del proyecto de implementación"],"answer":[1],"explanation":"El monitoreo de proveedores verifica de forma continua que el proveedor siga cumpliendo los requisitos durante toda la relación, por ejemplo con cuestionarios periódicos. La due diligence ocurre antes de contratar, el NDA protege información confidencial y el SOW describe un trabajo puntual."},{"id":"D5-032","domain":5,"objective":"5.3","type":"single","difficulty":1,"stem":"Una empresa necesita recopilar de forma estandarizada información sobre los controles de seguridad de sus 40 proveedores críticos. ¿Qué herramienta es la MÁS adecuada?","options":["Rules of engagement","Un questionnaire (cuestionario) de evaluación","Un business partners agreement (BPA)","Un work order (WO)"],"answer":[1],"explanation":"Los cuestionarios permiten obtener respuestas comparables sobre los controles de muchos proveedores a escala. Las rules of engagement delimitan una prueba de penetración, un WO autoriza un trabajo específico y un BPA regula la relación entre socios de negocio."},{"id":"D5-033","domain":5,"objective":"5.4","type":"single","difficulty":1,"stem":"Una empresa contrata a un proveedor externo para calcular la nómina de sus empleados. La empresa decide qué datos se recopilan y para qué; el proveedor solo los trata según sus instrucciones. ¿Qué rol tiene el proveedor?","options":["Data subject","Data owner","Controller","Processor"],"answer":[3],"explanation":"El processor trata datos personales en nombre y bajo las instrucciones del controller. La empresa es el controller porque determina fines y medios; el data owner es un rol interno de responsabilidad sobre los datos y los data subjects son los empleados cuyos datos se tratan."},{"id":"D5-034","domain":5,"objective":"5.4","type":"single","difficulty":2,"stem":"Una clienta residente en la Unión Europea solicita a una tienda en línea que elimine todos sus datos personales porque ya no desea ser clienta. ¿Qué derecho de privacidad está ejerciendo?","options":["La política de retención de datos de la tienda","El derecho a la portabilidad de datos","El right to be forgotten (derecho de supresión)","El principio de due care"],"answer":[2],"explanation":"El right to be forgotten, reconocido por el GDPR, permite al data subject solicitar la eliminación de sus datos personales cuando ya no hay base legal para conservarlos. La portabilidad implica entregar los datos en formato reutilizable, la retención define plazos internos de conservación y due care es una obligación de la organización."},{"id":"D5-035","domain":5,"objective":"5.4","type":"multi","difficulty":3,"stem":"Un hospital no corrige los hallazgos graves de privacidad señalados en varias inspecciones regulatorias. ¿Cuáles de las siguientes consecuencias de non-compliance son impuestas DIRECTAMENTE por el regulador? (Elige TRES.)","options":["Pérdida de la licencia de operación","Daño reputacional","Rescisión de contratos por parte de aseguradoras","Disminución del MTBF de los servidores","Sanciones","Multas (fines)"],"answer":[0,4,5],"explanation":"Las multas, sanciones y la revocación de licencias son medidas que el regulador puede imponer directamente. El daño reputacional proviene de la percepción pública, la rescisión de contratos es un impacto contractual decidido por terceros y el MTBF es una métrica de confiabilidad sin relación con el cumplimiento."},{"id":"D5-036","domain":5,"objective":"5.4","type":"single","difficulty":2,"stem":"Después de evaluar sus riesgos, una empresa aplica parches de forma constante, mantiene operando los controles seleccionados y capacita al personal, tal como lo haría una organización razonable de su sector. ¿Qué concepto demuestra principalmente?","options":["Due care","Due diligence","Exemption","Attestation"],"answer":[0],"explanation":"Due care es actuar de forma continua y razonable para proteger los activos, implementando y manteniendo los controles. Due diligence es la investigación y evaluación (por ejemplo, el análisis de riesgos que la empresa ya hizo) para entender los riesgos; attestation es una declaración formal de cumplimiento y exemption es una excepción a un requisito."},{"id":"D5-037","domain":5,"objective":"5.4","type":"single","difficulty":1,"stem":"Cada año, todos los empleados deben confirmar electrónicamente que leyeron y entendieron la política de seguridad vigente. ¿Qué práctica de compliance monitoring es esta?","options":["Due diligence de terceros","Examination regulatoria","Automatización del cumplimiento","Attestation and acknowledgement"],"answer":[3],"explanation":"Attestation and acknowledgement consiste en que las personas confirmen formalmente que conocen y aceptan cumplir políticas o requisitos. La due diligence evalúa riesgos o terceros, una examination la realiza un regulador y la automatización usa herramientas para verificar controles."},{"id":"D5-038","domain":5,"objective":"5.4","type":"single","difficulty":2,"stem":"Una empresa con más de 2,000 recursos en la nube necesita verificar de forma continua que sus configuraciones cumplan con los CIS Benchmarks y generar evidencia para los auditores con el mínimo esfuerzo manual. ¿Cuál es el MEJOR enfoque?","options":["Esperar la examination externa del regulador","Implementar compliance monitoring automatizado","Solicitar a cada administrador una attestation trimestral","Realizar una autoevaluación manual anual con hojas de cálculo"],"answer":[1],"explanation":"La automatización permite monitorear grandes volúmenes de recursos de manera continua y producir evidencia consistente. Las autoevaluaciones anuales y las attestations no detectan desviaciones en tiempo casi real, y depender del regulador es reactivo."},{"id":"D5-039","domain":5,"objective":"5.4","type":"single","difficulty":3,"stem":"Una nueva ley de protección de datos obliga a la empresa a responder solicitudes de acceso de los data subjects en un plazo de 30 días. La empresa no sabe en qué sistemas almacena datos personales. ¿Qué debe hacer PRIMERO?","options":["Elaborar un data inventory que identifique qué datos personales existen y dónde se almacenan","Reducir los plazos de la política de retención de datos","Comprar una solución de DLP y bloquear la salida de datos personales","Cifrar todas las bases de datos de la organización"],"answer":[0],"explanation":"Sin un inventario de datos la organización no puede localizar ni entregar la información solicitada, ni aplicar adecuadamente controles o retención. DLP, cifrado y retención son útiles, pero dependen de saber primero qué datos existen y dónde residen."},{"id":"D5-040","domain":5,"objective":"5.4","type":"multi","difficulty":2,"stem":"¿Cuáles de las siguientes actividades son ejemplos de compliance reporting EXTERNO? (Elige DOS.)","options":["Presentar al regulador financiero el informe anual de incidentes de ciberseguridad","Enviar el Report on Compliance (ROC) de PCI DSS al banco adquirente","Presentar al comité de auditoría el estado de los hallazgos internos","Entregar a la dirección los resultados de una autoevaluación","Publicar un tablero de métricas de cumplimiento para el CISO"],"answer":[0,1],"explanation":"El reporte externo se dirige a partes ajenas a la organización, como reguladores, bancos adquirentes o clientes. Los informes al comité de auditoría, al CISO o a la dirección son reportes internos que apoyan la supervisión."},{"id":"D5-041","domain":5,"objective":"5.4","type":"single","difficulty":3,"stem":"Una empresa domiciliada en México vende en línea a residentes de la Unión Europea y almacena sus datos en servidores ubicados en México. ¿Cuál afirmación es la MÁS precisa?","options":["El GDPR solo aplica si la empresa tiene una oficina física en la UE","Solo aplica la ley mexicana porque la empresa y sus servidores están en México","Debe cumplir tanto el GDPR como la legislación mexicana aplicable","Basta con que los clientes acepten la acceptable use policy del sitio"],"answer":[2],"explanation":"Las implicaciones legales de la privacidad pueden ser locales, nacionales y globales; el GDPR tiene alcance extraterritorial cuando se ofrecen bienes o servicios a personas en la UE. La ubicación de los servidores o de la oficina no elimina esa obligación y una AUP no sustituye los requisitos legales."},{"id":"D5-042","domain":5,"objective":"5.5","type":"multi","difficulty":1,"stem":"Un pentester inicia la fase de reconocimiento y no debe interactuar directamente con los sistemas del objetivo. ¿Cuáles de las siguientes actividades son reconocimiento PASIVO? (Elige DOS.)","options":["Revisar ofertas de empleo y redes sociales de la empresa","Hacer un ping sweep del rango de IP público","Realizar banner grabbing en los servidores web","Ejecutar un escaneo de puertos con Nmap","Consultar registros WHOIS y DNS públicos del dominio"],"answer":[0,4],"explanation":"El reconocimiento pasivo obtiene información de fuentes públicas (OSINT) sin enviar tráfico al objetivo. Escaneos de puertos, banner grabbing y ping sweeps interactúan directamente con los sistemas y son reconocimiento activo."},{"id":"D5-043","domain":5,"objective":"5.5","type":"single","difficulty":2,"stem":"Una organización realiza un ejercicio en el que el equipo atacante y el equipo de detección trabajan de forma coordinada, combinando tácticas ofensivas y defensivas y compartiendo hallazgos en tiempo real para mejorar los controles. ¿Qué tipo de prueba de penetración describe MEJOR este ejercicio?","options":["Unknown environment","Defensive","Offensive","Integrated"],"answer":[3],"explanation":"Una prueba integrated combina las perspectivas ofensiva (red team) y defensiva (blue team) para mejorar la detección y respuesta. Una prueba offensive se enfoca solo en atacar, una defensive solo en detectar y responder, y unknown environment describe el nivel de información previa del tester."},{"id":"D5-044","domain":5,"objective":"5.5","type":"single","difficulty":1,"stem":"Como parte de una evaluación autorizada, un consultor intenta entrar al edificio siguiendo de cerca a un empleado (tailgating) y clonar tarjetas de acceso de proximidad. ¿Qué tipo de prueba de penetración está realizando?","options":["Reconocimiento pasivo","Física","Partially known environment","Defensive"],"answer":[1],"explanation":"Las pruebas de penetración físicas evalúan controles como puertas, tarjetas, guardias y vestíbulos mediante técnicas como tailgating o clonación de credenciales. Defensive se refiere al equipo de detección, partially known al nivel de información previa y el reconocimiento pasivo no implica intentar acceder."},{"id":"D5-045","domain":5,"objective":"5.5","type":"single","difficulty":2,"stem":"Una firma de contadores públicos independiente emite una opinión formal por escrito sobre si los controles descritos por un proveedor de servicios están diseñados y operan eficazmente. ¿Cómo se llama este tipo de resultado?","options":["Attestation","Self-assessment","Escaneo de vulnerabilidades","Rules of engagement"],"answer":[0],"explanation":"Una attestation es una declaración formal de un tercero calificado sobre la exactitud o eficacia de los controles, como en un reporte SOC 2. Una self-assessment la realiza la propia organización, un escaneo de vulnerabilidades es una prueba técnica y las rules of engagement delimitan una prueba de penetración."},{"id":"D5-046","domain":5,"objective":"5.5","type":"single","difficulty":3,"stem":"Para asegurar la independencia y objetividad de la función de auditoría interna, ¿a quién debería reportar funcionalmente el director de auditoría interna?","options":["Al CIO, responsable de la estrategia tecnológica","Al gerente de operaciones de TI","Al comité de auditoría del consejo de administración","Al CISO, responsable del programa de seguridad"],"answer":[2],"explanation":"El comité de auditoría supervisa la auditoría interna precisamente para garantizar su independencia respecto de la gerencia que es auditada. El CIO, el gerente de operaciones de TI y el CISO son responsables de áreas que la auditoría interna evalúa, lo que crearía un conflicto de interés."},{"id":"D5-047","domain":5,"objective":"5.5","type":"single","difficulty":2,"stem":"Un cliente corporativo importante exige que una parte sin relación con la empresa verifique sus controles de seguridad; no acepta evaluaciones realizadas por el personal propio. ¿Qué debe contratar la empresa?","options":["Una auditoría interna de cumplimiento","Una auditoría independiente de terceros (independent third-party audit)","Un acknowledgement firmado por el director general","Una self-assessment del área de seguridad"],"answer":[1],"explanation":"Una auditoría independiente de terceros proporciona una opinión objetiva de una organización externa sin conflicto de interés. La autoevaluación y la auditoría interna son realizadas por personal propio y un acknowledgement solo confirma que alguien conoce una política."},{"id":"D5-048","domain":5,"objective":"5.5","type":"single","difficulty":2,"stem":"Personal de la autoridad supervisora bancaria realiza una revisión en sitio de los controles de TI de un banco y tiene facultades para ordenar acciones correctivas. ¿Cómo se clasifica MEJOR esta actividad?","options":["Una examination regulatoria externa","Una revisión del comité de auditoría","Una prueba de penetración de entorno desconocido","Una self-assessment interna"],"answer":[0],"explanation":"Las examinations son evaluaciones externas realizadas por reguladores con autoridad legal para exigir correcciones. La self-assessment y la revisión del comité de auditoría son internas, y una prueba de penetración evalúa técnicamente la seguridad sin facultades regulatorias."},{"id":"D5-049","domain":5,"objective":"5.5","type":"match","difficulty":2,"stem":"Relaciona cada descripción de una prueba de penetración con el tipo de entorno correspondiente.","items":["Al equipo se le entregan diagramas de red, credenciales administrativas y código fuente.","El tester solo recibe el nombre de la empresa y debe descubrir todo por su cuenta.","Se proporcionan los rangos de IP en alcance y una cuenta de usuario estándar, sin documentación interna.","Se busca simular fielmente a un atacante externo sin conocimiento previo del entorno.","Se otorga acceso completo para maximizar la cobertura en el menor tiempo posible."],"choices":["Known environment","Partially known environment","Unknown environment"],"answer":[0,2,1,2,0],"explanation":"En un known environment (white box) el tester tiene información completa, lo que maximiza la cobertura; en un partially known (gray box) recibe información limitada; en un unknown (black box) no recibe información y simula a un atacante externo."},{"id":"D5-050","domain":5,"objective":"5.6","type":"multi","difficulty":1,"stem":"Un usuario recibe un correo de soporte@micros0ft-help.com que dice: \"Su cuenta será suspendida en 1 hora. Haga clic aquí para verificar su contraseña\". ¿Cuáles son los indicadores de phishing MÁS claros en este mensaje? (Elige DOS.)","options":["El pie de página incluye una dirección postal","La urgencia y la amenaza de suspender la cuenta","El dominio del remitente imita a uno legítimo con un carácter sustituido","El mensaje se recibió un martes por la mañana","El correo usa formato HTML"],"answer":[1,2],"explanation":"Los dominios parecidos (typosquatting, como un cero en lugar de la letra o) y la presión de tiempo para actuar son indicadores clásicos de phishing. El día de envío, un pie de página con dirección o el formato HTML aparecen en correos legítimos y no indican fraude por sí solos."},{"id":"D5-051","domain":5,"objective":"5.6","type":"single","difficulty":2,"stem":"Varios usuarios reportaron el mismo correo sospechoso con el botón de reporte. El analista del SOC confirma que el enlace descarga malware. ¿Qué debe hacer a continuación para limitar MÁS el impacto?","options":["Programar una capacitación sobre phishing para el próximo trimestre","Eliminar el mensaje solo de los buzones de quienes lo reportaron","Buscar y eliminar todas las copias del mensaje de los buzones y bloquear el remitente y la URL","Responder a cada usuario agradeciendo el reporte y cerrar el ticket"],"answer":[2],"explanation":"Al confirmar un mensaje malicioso, la respuesta adecuada es purgarlo de todos los buzones y bloquear sus indicadores para proteger a quienes aún no lo han abierto. Limpiar solo los buzones de quienes reportaron deja expuestos a los demás; agradecer y capacitar son útiles, pero no contienen la amenaza inmediata."},{"id":"D5-052","domain":5,"objective":"5.6","type":"single","difficulty":3,"stem":"Tras la campaña inicial de phishing simulado, la tasa de clics fue de 28%. Después de seis meses de campañas mensuales, la tasa de clics bajó a 9%, pero solo el 5% de los usuarios reporta los correos sospechosos. ¿En qué debe enfocarse el programa de concientización a continuación?","options":["En cambiar a una sola campaña anual para reducir la fatiga","En suspender las campañas porque la tasa de clics ya es aceptable","En sancionar a los usuarios que hicieron clic durante la campaña inicial","En capacitar e incentivar a los usuarios para que reporten los mensajes sospechosos"],"answer":[3],"explanation":"El monitoreo recurrente muestra mejora en clics, pero una tasa de reporte baja limita la detección temprana; el siguiente paso es reforzar el reporte. Suspender o espaciar las campañas pierde la medición continua, y un enfoque punitivo desalienta el reporte."},{"id":"D5-053","domain":5,"objective":"5.6","type":"match","difficulty":3,"stem":"Relaciona cada comportamiento observado con la categoría de comportamiento anómalo que MEJOR lo describe.","items":["Un usuario sube archivos de la empresa a su almacenamiento personal en la nube para trabajar desde casa.","La cuenta de un contador inicia sesión a las 3:00 a. m. desde un país donde la empresa no opera.","Un empleado envía por error una hoja de cálculo con datos de clientes al destinatario equivocado.","Un usuario desactiva el antivirus porque considera que hace lenta su computadora.","Un empleado de recursos humanos accede de pronto a repositorios de código fuente que nunca había utilizado.","Un usuario presiona sin querer \"Responder a todos\" con un archivo confidencial adjunto."],"choices":["Risky","Unexpected","Unintentional"],"answer":[0,1,2,0,1,2],"explanation":"El comportamiento risky es una acción deliberada que eleva el riesgo (shadow IT, desactivar controles); el unexpected se desvía del patrón normal de la cuenta (horarios, ubicación, recursos inusuales); el unintentional es un error sin intención maliciosa."},{"id":"D5-054","domain":5,"objective":"5.6","type":"single","difficulty":1,"stem":"Se encontraron varias memorias USB etiquetadas como \"Nómina 2026\" en el estacionamiento y un empleado conectó una a su computadora. ¿Qué tema de capacitación aborda MÁS directamente esta situación?","options":["Insider threat","Removable media and cables","Password management","Hybrid/remote work environments"],"answer":[1],"explanation":"La capacitación sobre medios removibles y cables enseña a no conectar dispositivos desconocidos, que pueden contener malware o ser dispositivos maliciosos. La gestión de contraseñas, el trabajo remoto y la amenaza interna no tratan directamente este vector de baiting."},{"id":"D5-055","domain":5,"objective":"5.6","type":"multi","difficulty":2,"stem":"Una empleada trabaja de forma remota desde una cafetería y maneja información confidencial de clientes. ¿Cuáles de las siguientes prácticas son las MEJORES para este escenario? (Elige DOS.)","options":["Desactivar el firewall del equipo para mejorar la conectividad","Conectarse mediante la VPN corporativa al usar la Wi-Fi pública","Usar la computadora compartida de la cafetería si su batería se agota","Guardar los archivos en una memoria USB personal como respaldo","Usar un filtro de privacidad y estar atenta a quién puede ver su pantalla"],"answer":[1,4],"explanation":"En entornos remotos o híbridos, la VPN protege el tráfico en redes no confiables y el filtro de privacidad junto con la conciencia situacional reduce el shoulder surfing. Desactivar el firewall, usar medios personales o equipos compartidos aumenta el riesgo de exposición."},{"id":"D5-056","domain":5,"objective":"5.6","type":"single","difficulty":2,"stem":"Un empleado publica en redes sociales una foto de la nueva oficina; al fondo se ve un pizarrón con la contraseña de la Wi-Fi y los nombres en clave de proyectos confidenciales. ¿Qué tema de capacitación aborda MEJOR este comportamiento?","options":["Insider threat","Políticas de retención de datos","Removable media and cables","Operational security (OPSEC)"],"answer":[3],"explanation":"La seguridad operacional enseña a evitar que información aparentemente inocua, como fotos o publicaciones, revele datos útiles para un atacante. No hay indicios de intención maliciosa (insider threat), no involucra medios removibles y la retención de datos trata los plazos de conservación."}]</script>
<script>
(function(){
"use strict";
const BANK = JSON.parse(document.getElementById('bank').textContent);
const BY = Object.fromEntries(BANK.map(q=>[q.id,q]));
const DOM = {
  1:{n:"Conceptos generales de seguridad",en:"General Security Concepts",w:.12},
  2:{n:"Amenazas, vulnerabilidades y mitigaciones",en:"Threats, Vulnerabilities, and Mitigations",w:.22},
  3:{n:"Arquitectura de seguridad",en:"Security Architecture",w:.18},
  4:{n:"Operaciones de seguridad",en:"Security Operations",w:.28},
  5:{n:"Gestión y supervisión del programa",en:"Security Program Management and Oversight",w:.20}
};
const OBJ = {
"1.1":"Tipos de controles de seguridad","1.2":"Conceptos fundamentales (CIA, AAA, Zero Trust, deception)","1.3":"Gestión de cambios","1.4":"Soluciones criptográficas y PKI",
"2.1":"Actores de amenaza y motivaciones","2.2":"Vectores de amenaza y superficies de ataque","2.3":"Tipos de vulnerabilidades","2.4":"Indicadores de actividad maliciosa","2.5":"Técnicas de mitigación",
"3.1":"Modelos de arquitectura (cloud, IaC, ICS, IoT)","3.2":"Infraestructura empresarial segura","3.3":"Protección de datos","3.4":"Resiliencia y recuperación",
"4.1":"Seguridad en recursos de cómputo","4.2":"Gestión de activos","4.3":"Gestión de vulnerabilidades","4.4":"Alertas y monitoreo","4.5":"Mejora de capacidades (firewall, IDS/IPS, email, DLP)","4.6":"Gestión de identidades y accesos (IAM)","4.7":"Automatización y orquestación","4.8":"Respuesta a incidentes y forense","4.9":"Fuentes de datos para investigaciones",
"5.1":"Gobierno de seguridad","5.2":"Gestión de riesgos","5.3":"Riesgo de terceros","5.4":"Cumplimiento y privacidad","5.5":"Auditorías y evaluaciones","5.6":"Concientización en seguridad"
};
const PASS = 750, TARGET = .8125;
const QUOTA90 = {1:11,2:20,3:16,4:25,5:18};
const QUOTA30 = {1:4,2:7,3:5,4:8,5:6};
const LETTERS = "ABCDEFGH";

/* ---------- utils ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rich(s){
  const parts = String(s).split("```");
  return parts.map((p,i)=>{
    if(i%2===1){ return "<pre><code>"+esc(p.replace(/^[a-z]*\n/,"").replace(/^\n|\n$/g,""))+"</code></pre>"; }
    return p.split(/\n{2,}/).map(par=>par.trim()?"<p>"+esc(par).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")+"</p>":"").join("");
  }).join("");
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmtTime = s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const pct = x=>Math.round(x*100)+"%";
const scaled = r=>Math.round(100+800*r);
const fmtDate = ts=>new Date(ts).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"})+" · "+new Date(ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
function band(r,n){ if(!n) return ["Sin datos",""]; if(r>=.85) return ["Fuerte","ok"]; if(r>=TARGET) return ["En el límite","mid"]; if(r>=.65) return ["Débil","bad"]; return ["Crítico","bad"]; }
function barClass(r,n){ if(!n) return ""; return r>=.85?"ok":r>=TARGET?"mid":"bad"; }

/* ---------- grading ---------- */
function grade(q,v){
  if(v==null) return 0;
  if(q.type==="single") return v===q.answer[0]?1:0;
  if(q.type==="multi"){ if(!Array.isArray(v)||v.length!==q.answer.length) return 0; const a=[...v].sort().join(","),b=[...q.answer].sort().join(","); return a===b?1:0; }
  if(q.type==="match"){ if(!Array.isArray(v)) return 0; let c=0; q.answer.forEach((a,i)=>{if(v[i]===a)c++}); return c/q.answer.length; }
  return 0;
}
function answered(q,v){
  if(v==null) return false;
  if(q.type==="single") return typeof v==="number";
  if(q.type==="multi") return Array.isArray(v)&&v.length===q.answer.length;
  if(q.type==="match") return Array.isArray(v)&&v.every(x=>x!=null);
  return false;
}

/* ---------- storage ---------- */
const LS_ATT="secplus701.attempts", LS_CUR="secplus701.current";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const store = {attempts:lsGet(LS_ATT,[])};
function mergeAttempts(list){
  const m=new Map(store.attempts.map(a=>[a.id,a]));
  list.forEach(a=>{if(a&&a.id)m.set(a.id,a)});
  store.attempts=[...m.values()].sort((a,b)=>a.ts-b.ts);
  lsSet(LS_ATT,store.attempts);
}
async function saveAttempt(a){
  mergeAttempts([a]);
}
async function deleteAll(){
  store.attempts=[]; lsSet(LS_ATT,[]);
}

/* ---------- knowledge model ---------- */
function latestResults(){
  const last={}, seen={};
  for(const a of store.attempts){ for(const [id,s] of Object.entries(a.res||{})){ if(!BY[id]) continue; last[id]=s; seen[id]=(seen[id]||0)+1; } }
  return {last,seen};
}
function aggregate(res){
  const d={},o={};
  for(const [id,s] of Object.entries(res)){
    const q=BY[id]; if(!q) continue;
    (d[q.domain]=d[q.domain]||{c:0,n:0}); d[q.domain].c+=s; d[q.domain].n++;
    (o[q.objective]=o[q.objective]||{c:0,n:0}); o[q.objective].c+=s; o[q.objective].n++;
  }
  return {d,o};
}
function readiness(dAgg){
  let r=0,wsum=0;
  for(const k in DOM){ const x=dAgg[k]; if(x&&x.n){ r+=DOM[k].w*(x.c/x.n); wsum+=DOM[k].w; } }
  return wsum? {r:r/wsum,cov:wsum} : null;
}

/* ---------- exam builders ---------- */
const byDomain = d=>BANK.filter(q=>q.domain===+d).map(q=>q.id);
function pbqFirst(ids,rnd){
  const pbq=ids.filter(id=>BY[id].type==="match"), rest=ids.filter(id=>BY[id].type!=="match");
  return shuffle(pbq,rnd).concat(shuffle(rest,rnd));
}
function fixedExam(k){
  const rnd=mulberry(70100+k), ids=[];
  for(const d in QUOTA90){ const pool=shuffle(byDomain(d),mulberry(701+ +d)); ids.push(...pool.slice((k-1)*QUOTA90[d],k*QUOTA90[d])); }
  return pbqFirst(ids,rnd);
}
function smartPick(pool,n,rnd){
  const {seen,last}=latestResults();
  const scored=pool.map(id=>({id,k:(seen[id]?1:0)*2 + (last[id]===1?1:0) + rnd()*.9}));
  scored.sort((a,b)=>a.k-b.k);
  return scored.slice(0,n).map(x=>x.id);
}
function weightedExam(quota){
  const rnd=mulberry(Date.now()%2147483647), ids=[];
  for(const d in quota) ids.push(...smartPick(byDomain(d),quota[d],rnd));
  return pbqFirst(ids,rnd);
}
function practiceSet(dom,obj,n){
  const rnd=mulberry(Date.now()%2147483647);
  let pool=BANK.filter(q=>(dom==="all"||q.domain===+dom)&&(obj==="all"||q.objective===obj)).map(q=>q.id);
  return shuffle(smartPick(pool,Math.min(n,pool.length),rnd),rnd);
}
function missedSet(){
  const {last}=latestResults();
  return shuffle(Object.keys(last).filter(id=>last[id]<1),mulberry(Date.now()%2147483647));
}

/* ---------- session ---------- */
let S = lsGet(LS_CUR,null);
let view="home", tick=null, sheet=null, confirmEnd=false, lastResult=null, reviewFilter="bad";
function persist(){ lsSet(LS_CUR,S); }
function startSession(cfg){
  S={label:cfg.label,mode:cfg.mode,qids:cfg.qids,ans:{},flags:[],revealed:{},idx:0,elapsed:0,limit:cfg.limit||0,feedback:!!cfg.feedback,ts:Date.now()};
  persist(); confirmEnd=false; openExam();
}
function openExam(){ view="exam"; renderExam(); startTick(); window.scrollTo(0,0); }
function startTick(){
  stopTick(); let k=0, lastT=Date.now();
  tick=setInterval(()=>{
    const now=Date.now(), dt=Math.min((now-lastT)/1000,120); lastT=now;
    if(!S||view!=="exam") return;
    S.elapsed+=dt; k++; if(k%5===0) persist();
    updTimer();
    if(S.limit&&S.elapsed>=S.limit){ finish(true); }
  },1000);
}
function stopTick(){ if(tick){clearInterval(tick);tick=null} }
function updTimer(){
  const t=$("#timer"); if(!t||!S) return;
  if(S.limit){ const left=S.limit-S.elapsed; t.textContent=fmtTime(left); t.className="timer"+(left<=300?" crit":left<=600?" warn":""); t.setAttribute("aria-label","Tiempo restante "+fmtTime(left)); }
  else { t.textContent=fmtTime(S.elapsed); }
}
async function finish(timeUp){
  stopTick();
  const res={}; let sum=0;
  S.qids.forEach(id=>{const s=grade(BY[id],S.ans[id]);res[id]=Math.round(s*1000)/1000;sum+=s});
  const exam = S.mode==="exam"||S.mode==="diag";
  const a={id:"a_"+Date.now(),ts:Date.now(),label:S.label,mode:S.mode,n:S.qids.length,score:Math.round(sum*1000)/1000,
    scaled:exam?scaled(sum/S.qids.length):null,elapsed:S.elapsed,limit:S.limit,timeUp:!!timeUp,res,ans:S.ans,flags:S.flags};
  lastResult=a; S=null; lsSet(LS_CUR,null); sheet=null; confirmEnd=false; reviewFilter="bad";
  await saveAttempt(a);
  view="result"; renderResult(); window.scrollTo(0,0);
}
function abandon(){ stopTick(); S=null; lsSet(LS_CUR,null); sheet=null; view="home"; renderHome(); }
function pauseToHome(){ stopTick(); persist(); sheet=null; view="home"; renderHome(); window.scrollTo(0,0); }

/* ---------- HOME ---------- */
function renderHome(){
  stopTick();
  const {last,seen}=latestResults(), ag=aggregate(last), rd=readiness(ag.d);
  const examAtts=store.attempts.filter(a=>a.scaled!=null);
  const doneFixed=k=>store.attempts.filter(a=>a.label==="Examen "+k).length;
  const totalSeen=Object.keys(seen).length;
  const weakList=Object.entries(ag.o).filter(([k,v])=>v.n>=2).map(([k,v])=>({k,r:v.c/v.n,n:v.n})).sort((a,b)=>a.r-b.r||b.n-a.n).slice(0,6).filter(x=>x.r<.9);

function trendSvg(atts){
  const W=440,H=120,pl=34,pr=10,pt=10,pb=20, n=atts.length;
  const x=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)), y=v=>pt+(900-v)/(900-100)*(H-pt-pb);
  const pts=atts.map((a,i)=>[x(i),y(a.scaled)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts[n-1][0].toFixed(1)} ${H-pb} L ${pts[0][0].toFixed(1)} ${H-pb} Z`;
  const lp=pts[n-1], lv=atts[n-1].scaled;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tendencia de puntajes en simulacros" style="max-width:100%;display:block">
  ${[100,500,750,900].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===750?'stroke-dasharray="4 3" style="stroke:var(--ink-3)"':""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${v}</text>`).join("")}
  <path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:2.5}" fill="${atts[i].scaled>=PASS?"var(--ok)":"var(--bad)"}"/>`).join("")}
  <text x="${Math.min(lp[0],W-pr-4)}" y="${lp[1]-9}" text-anchor="end" font-size="11" font-weight="600" font-family="IBM Plex Mono,monospace" fill="var(--ink)">${lv}</text></svg>`;
}

/* ---------- EXAM ---------- */
function renderExam(){
  if(!S){view="home";return renderHome();}
  const id=S.qids[S.idx], q=BY[id], v=S.ans[id], fb=S.feedback, rev=fb&&S.revealed[id];
  const nAns=S.qids.filter(x=>answered(BY[x],S.ans[x])).length;
  const isFlag=S.flags.includes(id);
  let h=`<div class="bar"><div class="in"><span class="ttl">${esc(S.label)}</span><span class="ctr">${S.idx+1}/${S.qids.length}</span><span class="timer" id="timer"></span><button data-act="flag" class="${isFlag?"on":""}" aria-pressed="${isFlag}">${isFlag?"Marcada":"Marcar"}</button><button data-act="nav">Preguntas</button><button data-act="pause">Salir</button></div><div class="progress"><i style="width:${nAns/S.qids.length*100}%"></i></div></div>`;
  h+=`<div class="qwrap"><div class="qhead"><span class="eyebrow">Pregunta ${S.idx+1}</span>${q.type==="match"?`<span class="chip acc">Tipo PBQ</span>`:""}${q.type==="multi"?`<span class="chip">Selección múltiple</span>`:""}${fb?`<span class="chip">${q.objective} · ${esc(OBJ[q.objective])}</span>`:""}</div>`;
  h+=`<div class="stem">${rich(q.stem)}</div>`;
  if(q.type==="match"){
    h+=`<p class="hint">Asigna una categoría a cada elemento.</p><div class="match">`;
    q.items.forEach((it,i)=>{
      const cur=Array.isArray(v)?v[i]:null; let cls="";
      if(rev) cls=cur===q.answer[i]?"right":"wrong";
      h+=`<div class="mrow ${cls}"><span class="it">${rich(it).replace(/^<p>|<\/p>$/g,"")}</span><select id="m_${id}_${i}" data-mi="${i}" ${rev?"disabled":""} aria-label="Categoría para el elemento ${i+1}"><option value="">— Selecciona —</option>${q.choices.map((c,j)=>`<option value="${j}" ${cur===j?"selected":""}>${esc(c)}</option>`).join("")}</select>${rev&&cur!==q.answer[i]?`<span class="fix">Correcto: ${esc(q.choices[q.answer[i]])}</span>`:""}</div>`;
    });
    h+=`</div>`;
  }else{
    const multi=q.type==="multi", need=q.answer.length;
    if(multi) h+=`<p class="hint">Selecciona ${need}. Llevas ${Array.isArray(v)?v.length:0}.</p>`;
    h+=`<div class="opts" role="${multi?"group":"radiogroup"}">`;
    q.options.forEach((o,i)=>{
      const sel=multi?(Array.isArray(v)&&v.includes(i)):v===i;
      let cls=sel?"sel":"";
      if(rev){ const ok=q.answer.includes(i); cls=ok?"right":(sel?"wrong":""); cls+=" locked"; }
      h+=`<label class="opt ${multi?"multi":""} ${cls}"><input type="${multi?"checkbox":"radio"}" name="q_${id}" id="o_${id}_${i}" data-oi="${i}" ${sel?"checked":""} ${rev?"disabled":""}><span class="key">${LETTERS[i]}</span><span class="txt">${esc(o)}</span></label>`;
    });
    h+=`</div>`;
  }
  if(rev){
    const s=grade(q,v), cls=s===1?"ok":"bad";
    h+=`<div class="explain ${cls}"><b>${s===1?"Correcto.":s>0?`Parcial: ${pct(s)} de los elementos.`:"Incorrecto."}</b><div>${rich(q.explanation)}</div></div>`;
  }
  h+=`</div>`;
  const last=S.idx===S.qids.length-1;
  let right;
  if(fb&&!rev) right=`<button class="primary" data-act="check" ${answered(q,v)?"":"disabled"}>Comprobar</button>`;
  else if(last) right=`<button class="primary" data-act="nav">${fb?"Terminar":"Ir a revisión"}</button>`;
  else right=`<button class="primary" data-act="next">Siguiente →</button>`;
  h+=`<div class="dock"><div class="in"><button data-act="prev" ${S.idx===0?"disabled":""}>← Anterior</button><span class="kbd">A–F responder · ← → navegar · M marcar</span>${right}</div></div>`;
  if(sheet==="nav") h+=navSheet();
  $("#app").className=""; $("#app").innerHTML=h; updTimer();
}
function navSheet(){
  const fb=S.feedback;
  const nAns=S.qids.filter(x=>answered(BY[x],S.ans[x])).length, nFlag=S.flags.length, nUn=S.qids.length-nAns;
  let h=`<div class="sheet" data-act="closesheet"><div class="box" role="dialog" aria-label="Revisión de preguntas"><div class="row" style="justify-content:space-between"><h2>${fb?"Progreso":"Revisión antes de entregar"}</h2><button class="ghost" data-act="closesheet">Cerrar</button></div>`;
  h+=`<div class="legend"><span class="chip acc">${nAns} respondidas</span><span class="chip ${nUn?"bad":""}">${nUn} sin responder</span><span class="chip flag">${nFlag} marcadas</span>${S.limit?`<span class="chip">Quedan ${fmtTime(S.limit-S.elapsed)}</span>`:""}</div>`;
  h+=`<div class="navgrid">`+S.qids.map((id,i)=>{
    const q=BY[id], a=answered(q,S.ans[id]); let c=a?"ans":"";
    if(fb&&S.revealed[id]){const s=grade(q,S.ans[id]);c=s===1?"r-ok":s>0?"r-mid":"r-bad";}
    if(S.flags.includes(id)) c+=" flg"; if(i===S.idx) c+=" cur";
    return `<button class="${c}" data-act="go" data-i="${i}" aria-label="Pregunta ${i+1}${a?", respondida":""}${S.flags.includes(id)?", marcada":""}">${i+1}</button>`;
  }).join("")+`</div>`;
  if(nFlag) h+=`<div class="row"><button class="small" data-act="goflag">Ir a la primera marcada</button>${nUn?`<button class="small" data-act="gounans">Ir a la primera sin responder</button>`:""}</div>`;
  else if(nUn) h+=`<div class="row"><button class="small" data-act="gounans">Ir a la primera sin responder</button></div>`;
  if(confirmEnd){
    h+=`<div class="confirm"><b>${fb?"¿Terminar este bloque?":"¿Entregar el examen?"}</b><span class="small">${nUn?`Tienes ${nUn} sin responder; cuentan como incorrectas. `:""}${fb?"Las que no comprobaste se califican igual.":"Ya no podrás cambiar respuestas."}</span><div class="row"><button class="danger" data-act="finish">${fb?"Terminar":"Entregar examen"}</button><button data-act="cancelend">Seguir revisando</button></div></div>`;
  }else{
    h+=`<div class="row" style="justify-content:flex-end"><button class="primary" data-act="askend">${fb?"Terminar bloque":"Entregar examen"}</button></div>`;
  }
  h+=`</div></div>`;
  return h;
}
function setAns(val){ const id=S.qids[S.idx]; S.ans[id]=val; persist(); }
function pickOption(i){
  const id=S.qids[S.idx], q=BY[id]; if(q.type==="match"||!q.options[i]) return;
  if(S.feedback&&S.revealed[id]) return;
  if(q.type==="single") setAns(i);
  else{
    let v=Array.isArray(S.ans[id])?[...S.ans[id]]:[];
    if(v.includes(i)) v=v.filter(x=>x!==i);
    else{ v.push(i); if(v.length>q.answer.length) v.shift(); }
    setAns(v);
  }
  renderExam();
  const el=document.getElementById(`o_${id}_${i}`); if(el) el.focus({preventScroll:true});
}
function go(i){ S.idx=Math.max(0,Math.min(S.qids.length-1,i)); persist(); sheet=null; confirmEnd=false; renderExam(); window.scrollTo(0,0); }

/* ---------- RESULT ---------- */
function renderResult(){
  const a=lastResult; if(!a){view="home";return renderHome();}
  const ag=aggregate(a.res), r=a.score/a.n, isExam=a.scaled!=null, passed=isExam&&a.scaled>=PASS;
  let h=`<div class="row" style="justify-content:space-between;margin-bottom:18px"><button class="ghost" data-act="home">← Inicio</button><span class="small muted">${fmtDate(a.ts)}</span></div>`;

  h+=`<div class="grid2" style="margin-bottom:22px"><section class="panel"><h2>Por dominio</h2><div class="dbars">`;
  for(const k in DOM){ const x=ag.d[k]; if(!x) continue; const rr=x.c/x.n, [bl,bc]=band(rr,x.n);
    h+=`<div class="dbar"><div class="lab"><b>${k}.0</b><span>${DOM[k].n}</span><div class="track"><i class="${barClass(rr,x.n)}" style="width:${rr*100}%"></i><span class="tgt"></span></div></div><span class="pct">${pct(rr)}</span><span class="chip ${bc}">${bl}</span></div>`; }
  h+=`</div><p class="small muted">${(()=>{const ws=Object.keys(ag.d).filter(k=>ag.d[k].c/ag.d[k].n<TARGET).sort((x,y)=>ag.d[x].c/ag.d[x].n-ag.d[y].c/ag.d[y].n);return ws.length?`Por debajo del objetivo: ${ws.map(k=>DOM[k].n).join(", ")}. El dominio 4 pesa 28% del examen, así que cada punto ahí cuenta más.`:"Todos los dominios por encima de ~81% en este intento."})()}</p></section>`;
  const objs=Object.entries(ag.o).map(([k,v])=>({k,r:v.c/v.n,n:v.n,c:v.c})).sort((x,y)=>x.r-y.r||y.n-x.n);
  h+=`<section class="panel"><h2>Por objetivo del temario</h2><div class="scroll-x"><table class="objt"><thead><tr><th>Obj.</th><th>Tema</th><th style="text-align:right">Aciertos</th><th></th></tr></thead><tbody>`+
    objs.map(o=>`<tr><td class="mono">${o.k}</td><td class="small">${OBJ[o.k]}</td><td class="n">${Math.round(o.c*10)/10}/${o.n}</td><td><span class="mini"><i style="width:${o.r*100}%;background:var(--${o.r>=.85?"ok":o.r>=TARGET?"mid":"bad"})"></i></span></td></tr>`).join("")+`</tbody></table></div>`;
  const wk=objs.filter(o=>o.r<TARGET).slice(0,3);
  if(wk.length) h+=`<div class="row">${wk.map(o=>`<button class="small" data-act="drill" data-obj="${o.k}">Practicar ${o.k}</button>`).join("")}</div>`;
  h+=`</section></div>`;
  // review
  const flags=a.flags||[];
  const list=a.n?Object.keys(a.res):[];
  const cnt={bad:list.filter(id=>a.res[id]<1).length,flag:list.filter(id=>flags.includes(id)).length,all:list.length};
  h+=`<section><div class="row" style="justify-content:space-between"><h2>Revisión con explicaciones</h2><div class="tabs">${[["bad","Incorrectas"],["flag","Marcadas"],["all","Todas"]].map(([k,l])=>`<button class="small ${reviewFilter===k?"on":""}" data-act="rf" data-f="${k}">${l} (${cnt[k]})</button>`).join("")}</div></div>`;

  if(!shown.length) h+=`<p class="empty">${reviewFilter==="bad"?"Sin errores en este intento.":"No hay preguntas en este filtro."}</p>`;

  h+=`</section><div class="row" style="margin-top:26px"><button class="primary" data-act="home">Volver al inicio</button>${cnt.bad?`<button data-act="missed">Repasar errores</button>`:""}</div>`;
  $("#app").className="wrap"; $("#app").innerHTML=h;
}
function reviewCard(id,a){
  const q=BY[id]; if(!q) return ""; const v=(a.ans||{})[id], s=a.res[id], n=a.n?Object.keys(a.res).indexOf(id)+1:0;
  let h=`<article class="rv"><div class="qhead"><span class="eyebrow">#${n}</span><span class="chip ${s===1?"ok":s>0?"mid":"bad"}">${s===1?"Correcta":s>0?"Parcial":answered(q,v)?"Incorrecta":"Sin responder"}</span><span class="chip">${q.objective} · ${esc(OBJ[q.objective])}</span>${(a.flags||[]).includes(id)?`<span class="chip flag">Marcada</span>`:""}</div><div class="stem">${rich(q.stem)}</div>`;
  if(q.type==="match"){
    h+=`<div class="match">`+q.items.map((it,i)=>{const cur=Array.isArray(v)?v[i]:null, ok=cur===q.answer[i];return `<div class="mrow ${ok?"right":"wrong"}"><span class="it">${esc(it)}</span><span class="small"><b>${esc(q.choices[q.answer[i]])}</b>${ok?"":`<br><span class="muted">Tu respuesta: ${cur==null?"—":esc(q.choices[cur])}</span>`}</span></div>`}).join("")+`</div>`;
  }else{
    const sel=q.type==="multi"?(Array.isArray(v)?v:[]):(typeof v==="number"?[v]:[]);
    h+=`<div class="opts">`+q.options.map((o,i)=>{const ok=q.answer.includes(i),me=sel.includes(i);return `<label class="opt locked ${q.type==="multi"?"multi":""} ${ok?"right":me?"wrong":""}"><span class="key">${LETTERS[i]}</span><span class="txt">${esc(o)}${me?` <span class="small muted">· tu respuesta</span>`:""}</span></label>`}).join("")+`</div>`;
  }
  h+=`<div class="explain ${s===1?"ok":"bad"}">${rich(q.explanation)}</div></article>`;
  return h;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="closesheet"&&t.classList.contains("sheet")&&e.target!==t) return;
  switch(act){
    case "fixed": { const k=+t.dataset.k; startSession({label:"Examen "+k,mode:"exam",qids:fixedExam(k),limit:90*60}); break; }
    case "randexam": startSession({label:"Examen aleatorio",mode:"exam",qids:weightedExam(QUOTA90),limit:90*60}); break;
    case "diag": startSession({label:"Diagnóstico",mode:"diag",qids:weightedExam(QUOTA30),limit:35*60}); break;
    case "practice": { const d=$("#pdom").value,o=$("#pobj").value,n=+$("#pn").value,timed=$("#ptimed").checked; const ids=practiceSet(d,o,n); if(!ids.length) return;
      const lab=o!=="all"?`Práctica ${o}`:d!=="all"?`Práctica dominio ${d}.0`:"Práctica general"; startSession({label:lab,mode:"practice",qids:ids,feedback:true,limit:timed?ids.length*60:0}); break; }
    case "drill": { const o=t.dataset.obj; const ids=practiceSet("all",o,20); startSession({label:`Práctica ${o}`,mode:"practice",qids:ids,feedback:true}); break; }
    case "missed": { const ids=missedSet(); if(ids.length) startSession({label:"Repaso de errores",mode:"missed",qids:ids,feedback:true}); break; }
    case "resume": openExam(); break;
    case "discard": abandon(); break;
    case "pause": pauseToHome(); break;
    case "flag": { const id=S.qids[S.idx]; S.flags=S.flags.includes(id)?S.flags.filter(x=>x!==id):S.flags.concat(id); persist(); renderExam(); break; }
    case "nav": sheet="nav"; confirmEnd=false; renderExam(); break;
    case "closesheet": sheet=null; confirmEnd=false; renderExam(); break;
    case "askend": confirmEnd=true; renderExam(); break;
    case "cancelend": confirmEnd=false; renderExam(); break;
    case "finish": finish(false); break;
    case "go": go(+t.dataset.i); break;
    case "goflag": go(S.qids.findIndex(id=>S.flags.includes(id))); break;
    case "gounans": go(S.qids.findIndex(id=>!answered(BY[id],S.ans[id]))); break;
    case "next": go(S.idx+1); break;
    case "prev": go(S.idx-1); break;
    case "check": { const id=S.qids[S.idx]; S.revealed[id]=true; persist(); renderExam(); break; }
    case "home": view="home"; renderHome(); window.scrollTo(0,0); break;
    case "open": { const a=store.attempts.find(x=>x.id===t.dataset.id); if(a){lastResult=a;reviewFilter="bad";view="result";renderResult();window.scrollTo(0,0);} break; }
    case "rf": reviewFilter=t.dataset.f; renderResult(); break;
    case "wipe": t.outerHTML=`<span class="row"><span>¿Borrar todos los intentos? No se puede deshacer.</span><button class="danger small" data-act="wipeyes">Borrar</button><button class="small" data-act="home">Cancelar</button></span>`; break;
    case "wipeyes": deleteAll().then(()=>renderHome()); break;
  }
});
document.addEventListener("change",e=>{
  if(view!=="exam"||!S) return;
  const t=e.target;
  if(t.dataset.oi!=null){ pickOption(+t.dataset.oi); return; }
  if(t.dataset.mi!=null){ const id=S.qids[S.idx],q=BY[id]; let v=Array.isArray(S.ans[id])?[...S.ans[id]]:q.items.map(()=>null); v[+t.dataset.mi]=t.value===""?null:+t.value; setAns(v);
    if(S.feedback){ renderExam(); const el=document.getElementById(`m_${id}_${t.dataset.mi}`); if(el) el.focus({preventScroll:true}); } else { const p=$(".progress i"); if(p) p.style.width=(S.qids.filter(x=>answered(BY[x],S.ans[x])).length/S.qids.length*100)+"%"; } }
});
document.addEventListener("keydown",e=>{
  if(view!=="exam"||!S||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.target.tagName==="SELECT") return;
  if(sheet){ if(e.key==="Escape"){sheet=null;confirmEnd=false;renderExam();} return; }
  const k=e.key.toUpperCase();
  if(k.length===1&&LETTERS.slice(0,6).includes(k)){ pickOption(LETTERS.indexOf(k)); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ if(!(S.feedback&&!S.revealed[S.qids[S.idx]])&&S.idx<S.qids.length-1) go(S.idx+1); }
  else if(e.key==="ArrowLeft"){ if(S.idx>0) go(S.idx-1); }
  else if(k==="M"){ $('[data-act="flag"]').click(); }
});
window.addEventListener("pagehide",()=>{ if(S) persist(); });

renderHome();
})();
</script>
</html>
