1:22:33:44:55  canal 6   (registrado)\nSSID \"Corp-WiFi\"  BSSID 7a:3f:91:0c:de:21  canal 11  señal -32 dBm (no registrado)\nDeauthentication frames x 4,500 -> broadcast  (origen 00:11:22:33:44:55, falsificado)\n```\n¿Qué ataque es el MÁS probable?","options":["RFID cloning","DDoS amplificado mediante DNS","Evil twin","Bluejacking"],"answer":[2],"explanation":"Un AP no autorizado que anuncia el mismo SSID con señal más fuerte, junto con tramas de deautenticación falsificadas que desconectan a los clientes del AP legítimo, es un ataque evil twin para capturar tráfico o credenciales. Bluejacking usa Bluetooth, RFID cloning copia tarjetas de proximidad y la amplificación DNS satura enlaces."},{"id":"D2-052","domain":2,"objective":"2.4","type":"match","difficulty":3,"stem":"Empareja cada observación con el ataque que MEJOR la describe.","items":["Un atacante captura un token de autenticación válido en tránsito y lo retransmite más tarde, sin modificarlo, para obtener acceso.","El log muestra 25,000 intentos fallidos contra la cuenta \"administrador\" desde una sola IP en 10 minutos, probando palabras de un diccionario.","Un atacante genera millones de mensajes buscando dos con el mismo hash truncado a 32 bits, aprovechando que la probabilidad de coincidencia crece mucho más rápido que el número de intentos.","Una solicitud HTTP lleva un encabezado User-Agent con 8,000 caracteres \"AAAA…\" seguidos de bytes no imprimibles, y el servicio se reinicia.","Un intruso desactiva el aire acondicionado del centro de datos hasta que los servidores se apagan por sobrecalentamiento."],"choices":["Brute force","Replay","Environmental","Buffer overflow","Birthday","Password spraying"],"answer":[1,0,4,3,2],"explanation":"Muchas contraseñas contra una sola cuenta es brute force (spraying sería una contraseña contra muchas cuentas); retransmitir un token capturado es replay; manipular la climatización es un ataque físico environmental; una entrada sobredimensionada con bytes no imprimibles que provoca la caída del servicio indica buffer overflow; y buscar colisiones aprovechando la paradoja del cumpleaños es un birthday attack."},{"id":"D2-053","domain":2,"objective":"2.5","type":"single","difficulty":1,"stem":"Una empresa quiere asegurar que en las estaciones de trabajo de contabilidad solo puedan ejecutarse los programas aprobados y que cualquier otro ejecutable sea bloqueado por defecto. ¿Qué técnica de mitigación cumple MEJOR este requisito?","options":["Application allow list","Host-based firewall","Full-disk encryption","Application block list"],"answer":[0],"explanation":"Una allow list permite únicamente el software aprobado y bloquea todo lo demás por defecto. Una block list solo bloquea lo que ya se conoce como malo, el firewall de host controla tráfico de red y el cifrado de disco protege datos en reposo, no la ejecución de programas."},{"id":"D2-054","domain":2,"objective":"2.5","type":"single","difficulty":2,"stem":"Una empresa instala sensores IoT de climatización que tienen un firmware con poco soporte. Desea impedir que, si uno se ve comprometido, el atacante alcance los servidores de producción. ¿Qué mitigación es la MEJOR?","options":["Decomisionar todos los servidores de producción","Cifrar los discos de los servidores de producción","Colocar los sensores en una VLAN o segmento separado con reglas que solo permitan la comunicación con su servidor de gestión","Aplicar least privilege a las cuentas de los usuarios de climatización"],"answer":[2],"explanation":"La segmentación limita el movimiento lateral desde dispositivos de menor confianza hacia sistemas críticos. Decomisionar los servidores de producción no es viable, el cifrado en reposo no impide el acceso por red, y least privilege sobre cuentas de usuario no restringe el tráfico de los dispositivos."},{"id":"D2-055","domain":2,"objective":"2.5","type":"single","difficulty":2,"stem":"El EDR detecta comportamiento de ransomware en un portátil que está cifrando archivos de una unidad de red compartida. ¿Qué debe hacer PRIMERO el analista para limitar el daño?","options":["Aislar el equipo de la red mediante la función de contención del EDR","Restaurar los archivos de la unidad compartida desde el respaldo","Aplicar todos los parches pendientes del sistema operativo","Reinstalar el sistema operativo del portátil"],"answer":[0],"explanation":"La isolation del host detiene de inmediato la propagación y el cifrado de recursos de red, a la vez que conserva evidencia. Parchear no detiene un ataque en curso; restaurar antes de contener provocaría que los archivos se cifraran de nuevo; reinstalar destruye evidencia y no es el primer paso."},{"id":"D2-056","domain":2,"objective":"2.5","type":"single","difficulty":3,"stem":"La cuenta de servicio de la aplicación de respaldos es miembro de Domain Admins \"porque así lo recomendó el instalador\". La aplicación solo necesita leer los archivos de los servidores y escribir en el repositorio de respaldos. ¿Qué acción reduce MEJOR el riesgo?","options":["Rotar la contraseña de la cuenta de servicio cada 30 días","Retirar la cuenta de Domain Admins y asignarle únicamente los derechos de respaldo y los permisos sobre el repositorio que necesita","Habilitar el monitoreo de los inicios de sesión de la cuenta en el SIEM","Cifrar el repositorio de respaldos con AES-256"],"answer":[1],"explanation":"Least privilege reduce el alcance del daño si la cuenta se ve comprometida, ya que solo conserva los derechos estrictamente necesarios. Rotar contraseñas y monitorear ayudan, pero la cuenta seguiría teniendo control total del dominio; el cifrado protege los respaldos, no limita los privilegios."},{"id":"D2-057","domain":2,"objective":"2.5","type":"single","difficulty":1,"stem":"Un servidor de archivos con datos de clientes será retirado definitivamente. ¿Qué acción garantiza MEJOR que no se expongan datos ni queden accesos residuales?","options":["Deshabilitar el antivirus para acelerar el apagado final","Sanitizar o destruir los discos según el procedimiento y eliminar sus cuentas, registros DNS y reglas de firewall asociadas","Hacer un formateo rápido de los discos y donar el equipo","Desconectarlo de la red y guardarlo en la bodega de TI"],"answer":[1],"explanation":"Un decommissioning adecuado incluye sanitizar o destruir los medios y eliminar las referencias del activo (cuentas, DNS, reglas e inventario). Guardarlo deja datos recuperables, un formateo rápido no borra los datos de forma segura y deshabilitar el antivirus no aporta nada a la seguridad."},{"id":"D2-058","domain":2,"objective":"2.5","type":"single","difficulty":2,"stem":"Un equipo de seguridad descubre que los usuarios cambian con frecuencia la configuración de sus estaciones (desactivan el bloqueo de pantalla y habilitan servicios). Quiere que la línea base segura se aplique automáticamente y que cualquier desviación se corrija sin intervención manual. ¿Qué técnica de mitigación aplica?","options":["Decommissioning","Encryption","Isolation","Configuration enforcement"],"answer":[3],"explanation":"Configuration enforcement usa herramientas como GPO, MDM o gestión de configuración para aplicar y mantener una línea base, corrigiendo las desviaciones. Decommissioning retira activos, isolation contiene equipos comprometidos y el cifrado protege la confidencialidad de los datos."},{"id":"D2-059","domain":2,"objective":"2.5","type":"multi","difficulty":1,"stem":"Un administrador prepara un nuevo servidor web Linux para producción. ¿Qué acciones de hardening debe realizar? (Elige TRES.)","options":["Cambiar las contraseñas predeterminadas de todas las cuentas y servicios","Desinstalar el software innecesario incluido en la imagen base","Habilitar Telnet para facilitar la administración remota","Otorgar privilegios sudo a todos los usuarios del sistema","Deshabilitar los servicios y puertos que el servidor no necesita","Desactivar el firewall basado en host para mejorar el rendimiento"],"answer":[0,1,4],"explanation":"El hardening reduce la superficie de ataque al deshabilitar puertos y protocolos innecesarios, cambiar las contraseñas predeterminadas y eliminar software que no se usa. Telnet transmite en texto claro, el sudo generalizado viola el principio de least privilege y desactivar el firewall de host elimina una capa de defensa."},{"id":"D2-060","domain":2,"objective":"2.5","type":"multi","difficulty":3,"stem":"Una empresa necesita en sus endpoints: (1) identificar actividad maliciosa por su comportamiento, recopilar telemetría continua y, desde la consola central, terminar procesos o poner el equipo en cuarentena; y (2) filtrar en cada equipo, de forma local, las conexiones entrantes a puertos no autorizados. ¿Qué DOS controles cumplen MEJOR estos requisitos? (Elige DOS.)","options":["Host-based firewall","Application block list","Data loss prevention (DLP)","Endpoint detection and response (EDR)","Full-disk encryption","Decommissioning"],"answer":[0,3],"explanation":"EDR proporciona detección por comportamiento, telemetría y respuesta remota (matar procesos, aislar el equipo), y el host-based firewall filtra el tráfico entrante y saliente en cada equipo. El cifrado de disco protege datos en reposo, DLP evita fugas de información, la block list solo bloquea software conocido y decommissioning retira activos."},{"id":"D2-061","domain":2,"objective":"2.5","type":"multi","difficulty":2,"stem":"Un sistema SCADA heredado controla una línea de producción crítica. El fabricante cerró y no existen parches; reemplazarlo tomará 18 meses. ¿Qué DOS mitigaciones son las MÁS adecuadas mientras tanto? (Elige DOS.)","options":["Permitir el acceso remoto directo desde Internet para el personal de mantenimiento","Conservar las credenciales predeterminadas para facilitar el soporte técnico","Deshabilitar el registro de eventos para reducir la carga del sistema","Monitorear continuamente el tráfico y los eventos del sistema para detectar anomalías","Aislarlo en un segmento de red dedicado con reglas que solo permitan el tráfico estrictamente necesario","Aplicar los parches más recientes publicados por el fabricante"],"answer":[3,4],"explanation":"Cuando no es posible parchear, la segmentación y el monitoreo actúan como controles compensatorios que limitan la exposición y permiten detectar abusos. No hay parches disponibles, las credenciales predeterminadas y el acceso directo desde Internet amplían la superficie de ataque, y desactivar los logs elimina la capacidad de detección."},{"id":"D2-062","domain":2,"objective":"2.5","type":"match","difficulty":2,"stem":"Empareja cada acción con la técnica de mitigación que representa.","items":["Enviar los registros de firewalls y servidores al SIEM y configurar alertas.","Instalar la actualización del fabricante que corrige una vulnerabilidad crítica recién publicada.","Separar la red de puntos de venta del resto de la red corporativa en VLAN distintas con un firewall entre ellas.","Retirar un servidor obsoleto: borrar sus discos de forma segura y eliminarlo del inventario y del DNS.","Configurar en una carpeta compartida qué grupos pueden leer y cuáles pueden modificar su contenido.","Proteger los datos de los portátiles para que sean ilegibles si el equipo es robado."],"choices":["Patching","Encryption","Access control (ACL/permissions)","Monitoring","Segmentation","Decommissioning"],"answer":[3,0,4,5,2,1],"explanation":"Aplicar actualizaciones es patching; hacer ilegibles los datos robados es encryption; definir quién puede leer o modificar es access control mediante ACL y permisos; centralizar logs y alertas es monitoring; separar redes por zonas es segmentation; y retirar un activo de forma segura es decommissioning."},{"id":"D3-001","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Una empresa migra sus servidores de aplicaciones a un proveedor de nube bajo un modelo IaaS. Según la matriz de responsabilidad compartida, ¿cuál de las siguientes tareas es responsabilidad del CLIENTE?","options":["Aplicar parches al sistema operativo de las máquinas virtuales","Mantener la seguridad física del centro de datos","Aplicar parches al hypervisor que aloja las instancias","Reemplazar los discos físicos defectuosos del proveedor"],"answer":[0],"explanation":"En IaaS el proveedor administra la infraestructura física, la red subyacente y el hypervisor; el cliente es responsable de todo lo que instala encima, incluido el sistema operativo invitado y sus parches. La seguridad física, el hypervisor y el hardware son responsabilidad del proveedor."},{"id":"D3-002","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Una cadena de 40 sucursales autentica a todos sus usuarios contra un único servidor ubicado en la oficina central. Durante una falla del enlace WAN, ninguna sucursal pudo iniciar sesión. ¿Qué característica de esta arquitectura quedó en evidencia?","options":["Un modelo descentralizado dificulta aplicar políticas consistentes","Un modelo centralizado aumenta la superficie de ataque en cada sucursal","Un modelo descentralizado depende de un solo enlace de comunicaciones","Un modelo centralizado introduce un single point of failure"],"answer":[3],"explanation":"La arquitectura centralizada simplifica la administración y la aplicación de políticas, pero concentra el servicio en un solo punto, cuya falla afecta a todos. La dificultad para mantener políticas consistentes es una desventaja del modelo descentralizado, no del caso descrito, y la superficie de ataque en sucursales disminuye, no aumenta, al centralizar."},{"id":"D3-003","domain":3,"objective":"3.1","type":"single","difficulty":3,"stem":"Una organización despliega toda su infraestructura en la nube con plantillas de Infrastructure as Code (IaC) ejecutadas desde un pipeline CI/CD. ¿Cuál es el riesgo de seguridad MÁS significativo que introduce este modelo?","options":["Aumenta el configuration drift porque cada servidor se configura manualmente","Un error o cambio malicioso en una plantilla se replica de forma idéntica en todos los entornos desplegados","Se pierde la capacidad de auditar quién modificó la configuración","Obliga a mantener los entornos en una red air-gapped"],"answer":[1],"explanation":"IaC produce despliegues consistentes y repetibles; por la misma razón, una plantilla mal configurada o manipulada propaga la falla a todo lo que se despliega con ella, por lo que el repositorio y el pipeline deben protegerse y revisarse. IaC reduce el configuration drift en lugar de aumentarlo y, al estar en control de versiones, mejora la auditoría. No requiere aislamiento físico."},{"id":"D3-004","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Un equipo de desarrollo reemplaza servidores dedicados por funciones serverless (FaaS) de un proveedor de nube. ¿Qué responsabilidad de seguridad CONSERVA la organización?","options":["La aplicación de parches al sistema operativo de los servidores de ejecución","El aprovisionamiento de capacidad física cuando aumenta la demanda","El mantenimiento del hypervisor y del runtime subyacente","La seguridad del código de las funciones y los permisos que se les asignan"],"answer":[3],"explanation":"En serverless el proveedor administra servidores, sistema operativo, runtime y escalamiento; el cliente sigue siendo responsable de su código, sus dependencias y de no otorgar permisos excesivos a las funciones. Las demás tareas se transfieren al proveedor en este modelo."},{"id":"D3-005","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Una empresa divide una aplicación monolítica en decenas de microservicios que se comunican por API. ¿Cuál es la consideración de seguridad MÁS importante derivada de este cambio?","options":["Eliminar la autenticación entre componentes, porque todos pertenecen a la misma aplicación","Aceptar que el compromiso de un microservicio compromete siempre toda la aplicación","Usar una sola credencial compartida para que todos los servicios accedan a la base de datos","Proteger la comunicación entre servicios con autenticación y cifrado, ya que aumentan los endpoints expuestos"],"answer":[3],"explanation":"Los microservicios aíslan fallas y permiten escalar por componente, pero multiplican las API y el tráfico entre servicios, lo que amplía la superficie de ataque; por ello se recomienda autenticar y cifrar cada llamada (por ejemplo, con mTLS). Confiar implícitamente entre servicios o compartir credenciales contradice el principio de mínimo privilegio, y el aislamiento entre servicios precisamente busca evitar que un compromiso afecte a todo."},{"id":"D3-006","domain":3,"objective":"3.1","type":"single","difficulty":1,"stem":"Una planta de tratamiento de agua opera un sistema SCADA que controla bombas y válvulas. Los controladores no pueden parchearse y la dirección exige el MAYOR nivel de aislamiento posible frente a amenazas provenientes de Internet. ¿Qué arquitectura cumple MEJOR este requisito?","options":["Una VLAN dedicada en el switch corporativo","Microsegmentación mediante SDN","Una red air-gapped físicamente separada","Firewalls basados en host en cada HMI"],"answer":[2],"explanation":"El aislamiento físico (air gap) elimina cualquier conexión de red con Internet o con la red corporativa, por lo que ofrece el mayor nivel de separación para sistemas ICS/SCADA críticos. Las VLAN y la SDN son segmentación lógica sobre infraestructura compartida y pueden fallar por errores de configuración, y los firewalls de host no protegen los controladores sin parches."},{"id":"D3-007","domain":3,"objective":"3.1","type":"single","difficulty":3,"stem":"Un proveedor de servicios administrados implementa Software-Defined Networking (SDN) para automatizar la segmentación de su red. ¿Cuál es el riesgo de seguridad MÁS significativo de esta arquitectura?","options":["La SDN impide aplicar segmentación lógica entre cargas de trabajo","El compromiso del controlador SDN centralizado podría permitir reconfigurar toda la red","Cada switch debe configurarse manualmente, lo que aumenta los errores","El data plane deja de reenviar tráfico cuando se aplican políticas"],"answer":[1],"explanation":"SDN separa el control plane del data plane y centraliza las decisiones en un controlador; ese controlador se convierte en un objetivo de alto valor, porque quien lo controle puede redirigir o abrir tráfico en toda la red. La SDN facilita la segmentación y elimina la configuración manual por dispositivo, y el data plane sigue reenviando tráfico conforme a las políticas."},{"id":"D3-008","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Un arquitecto compara containers con máquinas virtuales para alojar aplicaciones de varios clientes en el mismo host. ¿Cuál es la implicación de seguridad MÁS relevante de los containers?","options":["Cada container incluye su propio kernel, lo que lo hace más aislado que una VM","Comparten el kernel del sistema operativo host, por lo que una vulnerabilidad en el kernel puede afectar a todos","No pueden escanearse en busca de vulnerabilidades antes del despliegue","Requieren hardware físico dedicado para cada container"],"answer":[1],"explanation":"Los containers virtualizan a nivel del sistema operativo y comparten el kernel del host, por lo que su aislamiento es menor que el de una VM, que ejecuta su propio sistema operativo completo sobre un hypervisor. Las imágenes de container sí pueden escanearse y muchos containers se ejecutan en un mismo host."},{"id":"D3-009","domain":3,"objective":"3.1","type":"single","difficulty":2,"stem":"Un hospital usa bombas de infusión con sistemas embebidos cuyo fabricante dejó de publicar actualizaciones de firmware. Reemplazarlas no es viable en el corto plazo. ¿Cuál es la MEJOR acción para reducir el riesgo?","options":["Instalar un agente EDR en cada bomba de infusión","Aislar las bombas en un segmento de red dedicado con ACL estrictas","Habilitar acceso remoto del fabricante a través de Internet","Aplicar parches de un sistema operativo de propósito general"],"answer":[1],"explanation":"Cuando un dispositivo embebido no puede parchearse, el control compensatorio adecuado es reducir su exposición mediante segmentación y reglas de acceso restrictivas. Normalmente no es posible instalar agentes de terceros en firmware cerrado, abrir acceso desde Internet aumentaría el riesgo y los parches de otros sistemas operativos no aplican."},{"id":"D3-010","domain":3,"objective":"3.1","type":"single","difficulty":3,"stem":"Un brazo robótico de una línea de ensamble es controlado por un RTOS que se ejecuta en hardware embebido. El equipo de seguridad propone instalar un agente de monitoreo en el controlador y el fabricante lo rechaza. ¿Cuál es la razón MÁS probable?","options":["Un RTOS no puede conectarse a ninguna red, por lo que el agente no reportaría eventos","Un RTOS es inmune al malware por diseño, así que el agente es innecesario","El agente consumiría recursos de cómputo y podría afectar los tiempos de respuesta deterministas que el RTOS debe garantizar","Los agentes de monitoreo solo funcionan en cargas de trabajo serverless"],"answer":[2],"explanation":"Un RTOS está diseñado para responder dentro de plazos estrictos y suele ejecutarse con poca capacidad de cómputo; agregar software puede introducir latencia impredecible y poner en riesgo la operación segura del equipo. Un RTOS sí puede estar conectado a una red y no es inmune al malware, y los agentes de monitoreo no se limitan a cargas serverless."},{"id":"D3-011","domain":3,"objective":"3.1","type":"single","difficulty":3,"stem":"Una empresa contrata un proveedor SaaS de nómina como parte de su estrategia de transferencia de riesgo. Meses después, una brecha en el proveedor expone datos de los empleados de la empresa. ¿Cuál afirmación es CORRECTA?","options":["La transferencia de riesgo eliminó por completo el riesgo, por lo que la empresa no tiene obligaciones","El proveedor asume toda la responsabilidad legal y la empresa no debe notificar a los afectados","En SaaS el cliente es responsable de aplicar parches a la aplicación del proveedor","La empresa sigue siendo responsable de sus datos ante los empleados y los reguladores, aunque haya transferido parte del impacto por contrato"],"answer":[3],"explanation":"Contratar a un tercero o asegurar un riesgo puede transferir parte del impacto financiero, pero la responsabilidad (accountability) por los datos permanece en la organización; por eso se requieren evaluaciones de proveedores, cláusulas de seguridad y derecho de auditoría. El riesgo no desaparece, las obligaciones de notificación siguen aplicando y en SaaS el proveedor parcha su aplicación."},{"id":"D3-012","domain":3,"objective":"3.1","type":"multi","difficulty":1,"stem":"Un auditor revisa cámaras IP, termostatos inteligentes y otros dispositivos IoT conectados a la red de una oficina. ¿Cuáles son las DOS debilidades de seguridad MÁS comunes en este tipo de dispositivos? (Elige DOS.)","options":["Exceso de capacidad de cómputo dedicada al cifrado","Credenciales predeterminadas o codificadas en el firmware (hardcoded)","Disponibilidad limitada o nula de actualizaciones de firmware","Integración nativa con el SIEM y el EDR corporativos","Soporte obligatorio de 802.1X con certificados de cliente"],"answer":[1,2],"explanation":"Los dispositivos IoT suelen venir con credenciales débiles o fijas y con poco o ningún soporte de parches del fabricante. Normalmente tienen recursos de cómputo limitados, rara vez se integran de forma nativa con herramientas de seguridad empresariales y muchas veces no soportan 802.1X."},{"id":"D3-013","domain":3,"objective":"3.1","type":"multi","difficulty":2,"stem":"Una organización adopta un modelo de hybrid cloud que combina su centro de datos on-premises con servicios de un proveedor de nube pública. ¿Cuáles son los DOS desafíos de seguridad MÁS comunes de este modelo? (Elige DOS.)","options":["Mantener políticas de seguridad y visibilidad consistentes entre ambos entornos","Desaparece la necesidad de una matriz de responsabilidad compartida","Integrar de forma segura la gestión de identidades y la conectividad entre on-premises y la nube","Los datos nunca transitan entre los entornos, por lo que no requieren cifrado","El proveedor de nube asume la seguridad de los servidores on-premises"],"answer":[0,2],"explanation":"En un entorno híbrido conviven herramientas, controles y responsabilidades distintos, lo que complica la consistencia de políticas y la visibilidad, y exige integrar identidades y enlaces seguros (VPN o enlaces dedicados) entre ambos lados. El proveedor no protege la infraestructura local, los datos sí viajan entre entornos y la matriz de responsabilidad sigue siendo necesaria para la parte en la nube."},{"id":"D3-014","domain":3,"objective":"3.1","type":"match","difficulty":2,"stem":"Relaciona cada característica con el modelo de arquitectura que MEJOR la describe. No todas las opciones se usan.","items":["Comparte el kernel del sistema operativo host entre instancias aisladas","Ejecuta código bajo demanda sin que el cliente administre servidores","Separa el control plane del data plane y centraliza las decisiones de red","Garantiza tiempos de respuesta deterministas en controladores industriales","Cada invitado ejecuta su propio sistema operativo completo sobre un hypervisor"],"choices":["Containerization","Serverless","SDN","RTOS","Virtualization","Microservices"],"answer":[0,1,2,3,4],"explanation":"Los containers comparten el kernel del host; serverless abstrae por completo los servidores; SDN separa el control plane del data plane; un RTOS prioriza el determinismo temporal; y la virtualización ejecuta sistemas operativos completos sobre un hypervisor. Microservices describe una forma de diseñar aplicaciones como servicios independientes, no ninguna de estas características."},{"id":"D3-015","domain":3,"objective":"3.2","type":"single","difficulty":1,"stem":"Los administradores necesitan gestionar servidores ubicados en una zona de alta seguridad sin habilitar acceso directo desde sus estaciones de trabajo a cada servidor. ¿Qué solución es la MEJOR?","options":["Un jump server endurecido como único punto de acceso administrativo a la zona","Un forward proxy que almacene en caché las sesiones administrativas","Un load balancer que distribuya las conexiones RDP entre los servidores","Un IDS pasivo conectado al switch de la zona"],"answer":[0],"explanation":"Un jump server (jump box) es un sistema endurecido y monitoreado que sirve como punto de entrada controlado a una zona segura, lo que reduce la superficie de ataque y centraliza la auditoría de las sesiones administrativas. Un proxy, un load balancer o un IDS no controlan el acceso administrativo a la zona."},{"id":"D3-016","domain":3,"objective":"3.2","type":"single","difficulty":2,"stem":"Un hospital instala un IPS en línea frente a los sistemas clínicos. La dirección decide que, si el IPS falla, la atención a pacientes no debe interrumpirse, aunque eso implique dejar pasar tráfico sin inspección. ¿Qué configuración cumple este requisito?","options":["Fail-closed","Fail-open","Modo pasivo mediante TAP","Modo de bloqueo predeterminado"],"answer":[1],"explanation":"Un dispositivo fail-open permite que el tráfico siga fluyendo si el dispositivo falla, priorizando la disponibilidad sobre la seguridad, que es lo que la dirección decidió. Fail-closed bloquearía todo el tráfico ante la falla; un TAP pasivo no estaría en línea y no permitiría bloquear ataques; y un modo de bloqueo predeterminado equivale a fallar cerrado."},{"id":"D3-017","domain":3,"objective":"3.2","type":"single","difficulty":2,"stem":"El equipo de seguridad necesita visibilidad del tráfico del segmento de servidores para detectar ataques, pero no debe agregar latencia ni crear un punto de falla que pueda interrumpir la red. ¿Qué implementación es la MEJOR?","options":["Un IPS en línea configurado en modo fail-closed","Un IDS pasivo que recibe una copia del tráfico desde un network TAP","Un IPS en línea configurado en modo fail-open","Un proxy transparente colocado entre el switch y los servidores"],"answer":[1],"explanation":"Un sensor pasivo conectado a un TAP o puerto SPAN analiza una copia del tráfico, por lo que no añade latencia ni interrumpe la red si falla; a cambio, solo puede detectar y alertar. Cualquier dispositivo en línea (IPS o proxy) añade latencia y forma parte de la ruta del tráfico, aunque falle abierto."},{"id":"D3-018","domain":3,"objective":"3.2","type":"single","difficulty":2,"stem":"Una empresa descubre que visitantes conectan laptops personales a los puertos Ethernet de las salas de juntas y obtienen acceso a la red interna. Se quiere que cada dispositivo presente un certificado válido y sea autenticado de forma centralizada antes de que el switch habilite el puerto. ¿Qué control debe implementarse?","options":["802.1X con un servidor RADIUS","Filtrado por dirección MAC en cada puerto","Port mirroring hacia un IDS","Asignar los puertos a una VLAN de datos estática"],"answer":[0],"explanation":"802.1X es el estándar de control de acceso por puerto: el switch (authenticator) mantiene el puerto bloqueado hasta que el dispositivo (supplicant) se autentica ante un servidor RADIUS usando un método EAP como EAP-TLS. El filtrado MAC no usa certificados y es fácil de evadir con MAC spoofing, el port mirroring solo copia tráfico y una VLAN estática no autentica a nadie."},{"id":"D3-019","domain":3,"objective":"3.2","type":"single","difficulty":1,"stem":"Una aplicación web pública recibe intentos frecuentes de SQL injection y cross-site scripting (XSS). Los desarrolladores tardarán varias semanas en corregir el código. ¿Qué control ofrece la protección MÁS inmediata?","options":["Un firewall stateful de capa 4","Un NIDS pasivo conectado a un puerto SPAN","Un concentrador VPN para los usuarios","Un web application firewall (WAF)"],"answer":[3],"explanation":"Un WAF inspecciona el tráfico HTTP/HTTPS a nivel de aplicación y puede bloquear patrones de inyección y XSS mientras se corrige el código. Un firewall de capa 4 solo evalúa direcciones y puertos, un NIDS pasivo solo alerta y una VPN no aplica a una aplicación pública."},{"id":"D3-020","domain":3,"objective":"3.2","type":"single","difficulty":2,"stem":"Los usuarios eluden el bloqueo de una aplicación de mensajería no autorizada, que ahora usa el puerto TCP 443. El firewall actual solo filtra por dirección IP y puerto. ¿Qué solución es la MEJOR?","options":["Un NGFW con inspección de aplicaciones de capa 7","Un firewall stateful de capa 4 con una regla adicional para TCP 443","Un load balancer delante del gateway de Internet","Un IDS pasivo conectado a un network TAP"],"answer":[0],"explanation":"Un NGFW identifica las aplicaciones por su comportamiento y contenido (capa 7), no solo por el puerto, por lo que puede bloquear la aplicación aunque use 443. Bloquear TCP 443 en un firewall de capa 4 cortaría toda la navegación HTTPS, un load balancer no filtra aplicaciones y un IDS pasivo no bloquea."},{"id":"D3-021","domain":3,"objective":"3.2","type":"single","difficulty":3,"stem":"Una empresa con personal mayoritariamente remoto y aplicaciones SaaS quiere dejar de enviar todo el tráfico a su centro de datos. Busca combinar la optimización de red de SD-WAN con servicios de seguridad como SWG, CASB, ZTNA y firewall-as-a-service, entregados desde la nube cerca de cada usuario. ¿Qué enfoque cumple MEJOR estos requisitos?","options":["SD-WAN por sí solo","Un concentrador VPN de acceso remoto en el centro de datos","Un UTM en la oficina central","SASE"],"answer":[3],"explanation":"SASE (Secure Access Service Edge) converge capacidades de red como SD-WAN con servicios de seguridad entregados desde la nube, de modo que la política se aplica cerca del usuario sin regresar el tráfico al centro de datos. SD-WAN por sí solo optimiza la conectividad pero no aporta esos servicios de seguridad, y un concentrador VPN o un UTM centralizados obligan a enviar el tráfico a la oficina central."},{"id":"D3-022","domain":3,"objective":"3.2","type":"single","difficulty":3,"stem":"Dos oficinas se conectarán con un túnel site-to-site. El requisito es cifrar el paquete IP original completo, incluidos sus encabezados, y garantizar su integridad. ¿Qué configuración de IPSec cumple MEJOR el requisito?","options":["ESP en tunnel mode","ESP en transport mode","AH en tunnel mode","AH en transport mode"],"answer":[0],"explanation":"ESP aporta confidencialidad (cifrado), integridad y autenticación, y en tunnel mode encapsula y cifra el paquete original completo, que es el modo habitual en conexiones site-to-site. En transport mode el encabezado IP original no se cifra, y AH solo aporta integridad y autenticación sin cifrado, en cualquiera de los dos modos."},{"id":"D3-023","domain":3,"objective":"3.2","type":"multi","difficulty":1,"stem":"Un servidor web recién desplegado en la DMZ tiene instalados servicios y componentes por defecto. ¿Cuáles DOS acciones reducen MEJOR su superficie de ataque? (Elige DOS.)","options":["Habilitar RDP desde Internet para facilitar la administración","Deshabilitar los servicios y cerrar los puertos que no se necesitan","Agregar una segunda NIC conectada directamente a la red interna","Instalar herramientas de desarrollo para depurar en producción","Eliminar cuentas predeterminadas y aplicaciones de ejemplo"],"answer":[1,4],"explanation":"Reducir la superficie de ataque implica eliminar todo lo que no es necesario: servicios, puertos, cuentas predeterminadas y contenido de ejemplo. Conectar el servidor a la red interna, exponer RDP o instalar herramientas adicionales agrega puntos de entrada y la aumenta."},{"id":"D3-024","domain":3,"objective":"3.2","type":"multi","difficulty":2,"stem":"Una organización implementa control de acceso a la red basado en 802.1X. ¿Cuáles son los TRES componentes que participan en el proceso de autenticación? (Elige TRES.)","options":["Supplicant (el dispositivo o software cliente)","Jump server","Puerto SPAN","Authentication server (por ejemplo, RADIUS)","Load balancer","Authenticator (el switch o access point)"],"answer":[0,3,5],"explanation":"En 802.1X el supplicant solicita acceso, el authenticator (switch o AP) controla el puerto y transporta los mensajes EAP, y el authentication server, normalmente RADIUS, valida las credenciales. Un puerto SPAN, un jump server y un load balancer no forman parte del proceso."},{"id":"D3-025","domain":3,"objective":"3.2","type":"match","difficulty":3,"stem":"Una empresa rediseña su red con cuatro zonas de seguridad. Asigna cada sistema a la zona MÁS adecuada.","items":["Servidor web público de la tienda en línea","Relay SMTP que recibe correo desde Internet","Servidor de base de datos con información de clientes","Router de borde con ACL hacia el ISP","Estaciones de trabajo de los empleados","Interfaces de administración out-of-band de switches y firewalls"],"choices":["Screened subnet (DMZ)","Red interna","Perímetro","Red de administración (management)"],"answer":[0,0,1,2,1,3],"explanation":"Los servicios que deben aceptar conexiones desde Internet (web y relay SMTP) van en la screened subnet; los datos sensibles y los usuarios permanecen en la red interna, sin exposición directa. El router de borde forma el perímetro, y las interfaces de administración se aíslan en una red de gestión dedicada para que un compromiso en otra zona no permita reconfigurar la infraestructura."},{"id":"D3-026","domain":3,"objective":"3.2","type":"match","difficulty":1,"stem":"Relaciona cada necesidad con el dispositivo de red que la cubre MEJOR.","items":["Inspeccionar el tráfico en línea y bloquear ataques en tiempo real","Generar alertas a partir de una copia del tráfico, sin bloquear","Distribuir solicitudes entre varios servidores web y retirar los que fallan los health checks","Filtrar y almacenar en caché la navegación de los usuarios hacia Internet","Ofrecer un punto de acceso endurecido para administrar una zona segura"],"choices":["IPS","IDS","Load balancer","Proxy server","Jump server"],"answer":[0,1,2,3,4],"explanation":"El IPS opera en línea y puede bloquear; el IDS es pasivo y solo detecta y alerta; el load balancer reparte la carga y verifica la salud de los servidores; el forward proxy intermedia, filtra y almacena en caché la navegación; y el jump server controla el acceso administrativo a zonas seguras."},{"id":"D3-027","domain":3,"objective":"3.3","type":"single","difficulty":2,"stem":"Un comercio quiere reducir el alcance de su auditoría PCI DSS. Su plan es reemplazar los números de tarjeta en sus sistemas por valores aleatorios sin relación matemática con el original y almacenar la correspondencia en una bóveda protegida. ¿Qué método describe este plan?","options":["Encryption","Tokenization","Masking","Hashing"],"answer":[1],"explanation":"La tokenización sustituye el dato sensible por un token sin relación matemática con el original; solo la bóveda de tokens puede hacer la correspondencia, por lo que los sistemas que manejan únicamente tokens pueden quedar fuera del alcance. El cifrado es reversible con la clave, el masking oculta parte del dato al mostrarlo y el hashing produce un resumen no reversible que no se puede canjear por el dato original."},{"id":"D3-028","domain":3,"objective":"3.3","type":"single","difficulty":1,"stem":"En un centro de atención telefónica, los agentes solo deben ver los últimos cuatro dígitos del número de tarjeta del cliente para validar su identidad. ¿Qué método de protección de datos cumple este requisito?","options":["Tokenization","Hashing","Geographic restrictions","Data masking"],"answer":[3],"explanation":"El data masking oculta parte del dato (por ejemplo, ************1234) para que el usuario vea solo lo necesario. La tokenización reemplaza todo el valor por un token, el hashing produce un valor ilegible y las restricciones geográficas limitan el acceso según la ubicación, no lo que se muestra."},{"id":"D3-029","domain":3,"objective":"3.3","type":"single","difficulty":2,"stem":"Un desarrollador debe almacenar las contraseñas de los usuarios de modo que ni los administradores de la base de datos puedan recuperarlas y que se dificulten los ataques con rainbow tables. ¿Qué método es el MEJOR?","options":["Cifrado simétrico AES-256 con una clave central","Tokenization con una bóveda de tokens","Hashing con un salt único por contraseña","Data masking de la columna de contraseñas"],"answer":[2],"explanation":"El hashing es unidireccional, por lo que no se puede revertir para obtener la contraseña, y el salt único hace que dos contraseñas iguales produzcan hashes distintos, lo que inutiliza las rainbow tables. El cifrado y la tokenización son reversibles para quien tenga la clave o acceso a la bóveda, y el masking solo cambia cómo se muestra el dato."},{"id":"D3-030","domain":3,"objective":"3.3","type":"single","difficulty":2,"stem":"Una empresa europea evalúa un proveedor de nube. El área legal exige que los datos personales de sus clientes permanezcan sujetos a las leyes y regulaciones del país donde se recopilaron. ¿Qué concepto describe MEJOR este requisito?","options":["Data masking","Permission restrictions","Data sovereignty","Data in transit"],"answer":[2],"explanation":"La soberanía de datos establece que los datos están sujetos a las leyes del país o región donde se recopilan o almacenan, lo que influye en la elección de regiones del proveedor y en las transferencias internacionales. Masking y las restricciones de permisos son métodos de protección, y data in transit es un estado de los datos."},{"id":"D3-031","domain":3,"objective":"3.3","type":"single","difficulty":2,"stem":"Un analista asigna un control a cada estado de los datos. ¿Cuál de las siguientes combinaciones es CORRECTA?","options":["Data in transit: full-disk encryption en los servidores de la base de datos","Data at rest: TLS 1.3 entre el navegador y el servidor web","Data in use: secure enclave que protege los datos en memoria mientras se procesan","Data in transit: tokenización de los registros almacenados en la base de datos"],"answer":[2],"explanation":"Los datos en uso están en memoria o en la CPU mientras se procesan, y tecnologías como los secure enclaves los protegen en ese estado. El full-disk encryption y la tokenización de registros almacenados protegen datos en reposo, y TLS protege datos en tránsito, por lo que las demás combinaciones están invertidas."},{"id":"D3-032","domain":3,"objective":"3.3","type":"single","difficulty":1,"stem":"El equipo de seguridad observa intentos de inicio de sesión en la aplicación de recursos humanos desde países donde la empresa no tiene operaciones ni empleados. ¿Qué control reduce MEJOR este riesgo?","options":["Data sovereignty","Geographic restrictions basadas en geolocalización de IP","Data masking","Hashing de las credenciales"],"answer":[1],"explanation":"Las restricciones geográficas usan la geolocalización (por ejemplo, de la dirección IP) para permitir o bloquear el acceso según la ubicación del solicitante. La soberanía de datos es un concepto legal sobre dónde residen los datos, el masking oculta datos al mostrarlos y el hashing de credenciales no impide los intentos de inicio de sesión."},{"id":"D3-033","domain":3,"objective":"3.3","type":"single","difficulty":2,"stem":"Una empresa traslada los datos de tarjetahabientes a una base de datos separada, alojada en una subred independiente, detrás de su propio firewall y con controles de acceso más estrictos que el resto de los sistemas. ¿Qué método de protección está aplicando?","options":["Obfuscation","Masking","Hashing","Segmentation"],"answer":[3],"explanation":"La segmentación separa los datos sensibles en sistemas o redes distintos con controles propios, lo que limita quién puede llegar a ellos y reduce el impacto de un compromiso en otras áreas. La ofuscación dificulta entender los datos o el código, el masking oculta datos al mostrarlos y el hashing los transforma de forma irreversible."},{"id":"D3-034","domain":3,"objective":"3.3","type":"single","difficulty":3,"stem":"El equipo de QA necesita una copia de la base de datos de producción con datos realistas para pruebas. Los datos deben conservar su formato (por ejemplo, un RFC sigue pareciendo un RFC), pero NO debe existir ninguna forma de recuperar los valores reales a partir de la copia. ¿Qué método es el MÁS adecuado?","options":["Static data masking que sustituya los valores sensibles de forma irreversible","Tokenization con una bóveda de tokens accesible para QA","Cifrado AES de las columnas sensibles con la clave entregada a QA","Hashing SHA-256 de las columnas sensibles"],"answer":[0],"explanation":"El enmascaramiento estático reemplaza los datos sensibles por valores ficticios con formato realista, sin vínculo recuperable con los originales, lo que es ideal para entornos de prueba. La tokenización y el cifrado son reversibles (vía la bóveda o la clave), y un hash SHA-256 no conserva el formato original del dato."},{"id":"D3-035","domain":3,"objective":"3.3","type":"single","difficulty":3,"stem":"Durante una revisión de arquitectura, un gerente pregunta por la diferencia entre tokenization y encryption. ¿Cuál afirmación es CORRECTA?","options":["Un token no tiene relación matemática con el dato original, por lo que no puede revertirse con un algoritmo ni una clave","La tokenización usa una clave simétrica para transformar el dato y puede revertirse con esa clave","El cifrado produce un resultado irreversible, al igual que el hashing","La tokenización y el cifrado son equivalentes, pero la tokenización requiere más cómputo"],"answer":[0],"explanation":"En la tokenización, la relación entre el token y el dato real solo existe en la bóveda de tokens; robar tokens no permite recuperar los datos mediante criptoanálisis. El cifrado sí es reversible con la clave correcta, a diferencia del hashing, y ambos métodos no son equivalentes."},{"id":"D3-036","domain":3,"objective":"3.3","type":"single","difficulty":1,"stem":"Según el esquema de clasificación de una organización, ¿qué clasificación corresponde a un comunicado de prensa ya aprobado y publicado en el sitio web corporativo?","options":["Confidential","Restricted","Public","Private"],"answer":[2],"explanation":"La información pública está aprobada para su divulgación y su exposición no causa daño a la organización. Confidential, restricted y private se aplican a información cuyo acceso debe limitarse a personas autorizadas."},{"id":"D3-037","domain":3,"objective":"3.3","type":"multi","difficulty":1,"stem":"Una aplicación envía registros de nómina desde un servidor de aplicaciones hacia una base de datos ubicada en otro centro de datos. ¿Cuáles DOS controles protegen esos datos MIENTRAS viajan por la red? (Elige DOS.)","options":["Full-disk encryption en el servidor de base de datos","Obfuscation del código fuente de la aplicación","Un túnel VPN IPSec entre ambos centros de datos","Data masking en los reportes de nómina","TLS entre la aplicación y la base de datos"],"answer":[2,4],"explanation":"TLS e IPSec cifran los datos en tránsito y protegen su confidencialidad e integridad mientras viajan por la red. El full-disk encryption protege datos en reposo, el masking controla lo que se muestra a los usuarios y la ofuscación del código no protege los datos transmitidos."},{"id":"D3-038","domain":3,"objective":"3.3","type":"match","difficulty":2,"stem":"Relaciona cada conjunto de información con el tipo de dato que MEJOR lo describe.","items":["Expedientes médicos de pacientes sujetos a regulación de privacidad en salud","Fórmula de una bebida no patentada, cuyo valor depende de mantenerla en secreto","Código fuente de un producto, protegido por derechos de autor","Documentos de un litigio en curso con un exproveedor","Estados de resultados y registros contables de la empresa","Códigos QR que solo pueden interpretarse con un lector"],"choices":["Regulated","Trade secret","Intellectual property","Legal","Financial","Non-human-readable"],"answer":[0,1,2,3,4,5],"explanation":"Los datos de salud están sujetos a leyes y regulaciones específicas (regulated); un secreto comercial protege su valor manteniéndose confidencial sin registro; el software con derechos de autor es propiedad intelectual; los documentos de litigio son datos legales; la información contable es financiera; y un código QR es un formato legible por máquinas, no por personas."},{"id":"D3-039","domain":3,"objective":"3.4","type":"single","difficulty":1,"stem":"Un banco determina que su plataforma de pagos tiene un RTO menor a una hora y cuenta con presupuesto suficiente para la recuperación. ¿Qué tipo de sitio de recuperación es el MÁS adecuado?","options":["Warm site","Hot site","Cold site","Respaldos en cinta almacenados offsite"],"answer":[1],"explanation":"Un hot site tiene hardware, software, conectividad y datos actualizados listos para operar en minutos, lo que cumple un RTO muy corto aunque sea la opción más costosa. Un warm site requiere horas o días para restaurar datos y configurar sistemas, un cold site días o semanas, y las cintas offsite son solo un medio de respaldo, no un sitio."},{"id":"D3-040","domain":3,"objective":"3.4","type":"single","difficulty":2,"stem":"Dos servidores de base de datos comparten almacenamiento y se monitorean mediante un heartbeat. Si el nodo principal falla, el secundario asume su dirección IP virtual y continúa el servicio. ¿Qué solución de alta disponibilidad describe este escenario?","options":["Clustering en configuración active/passive","Load balancing con algoritmo round-robin","Geographic dispersion entre regiones","Snapshots programados del almacenamiento"],"answer":[0],"explanation":"Un clúster agrupa nodos que se comportan como un solo sistema; en active/passive, el nodo en espera toma el control cuando detecta la falla del principal. El load balancing reparte solicitudes entre servidores independientes, la dispersión geográfica se refiere a la ubicación de los sitios y los snapshots son un mecanismo de respaldo, no de conmutación."},{"id":"D3-041","domain":3,"objective":"3.4","type":"single","difficulty":1,"stem":"El comité de continuidad quiere validar su plan de continuity of operations (COOP) reuniendo a los responsables clave para que analicen un escenario de ransomware paso a paso, sin afectar ningún sistema y al menor costo. ¿Qué tipo de prueba debe realizar?","options":["Failover test","Parallel processing","Simulación con equipos técnicos en producción","Tabletop exercise"],"answer":[3],"explanation":"Un tabletop exercise es una discusión guiada de un escenario en la que los participantes revisan roles y decisiones sin tocar los sistemas, por lo que es la prueba de menor costo e impacto. Las pruebas de failover, procesamiento paralelo y simulación técnica implican operar sistemas reales o de respaldo."},{"id":"D3-042","domain":3,"objective":"3.4","type":"single","difficulty":2,"stem":"Antes de declarar listo su sitio alterno, una empresa ejecuta los sistemas de recuperación al mismo tiempo que los de producción, procesando las mismas transacciones para comparar resultados sin interrumpir la operación. ¿Qué tipo de prueba se está realizando?","options":["Tabletop exercise","Failover test","Parallel processing","Simulación"],"answer":[2],"explanation":"En una prueba de procesamiento paralelo, los sistemas de respaldo procesan la misma carga que producción para verificar que producen resultados correctos sin afectar la operación. Un tabletop es solo una discusión, un failover test transfiere realmente la operación al sitio alterno y una simulación recrea un escenario sin procesar la carga real en paralelo."},{"id":"D3-043","domain":3,"objective":"3.4","type":"single","difficulty":3,"stem":"A las 14:37 un error de aplicación corrompió varias tablas de una base de datos transaccional. El último respaldo completo es de las 02:00. El negocio requiere restaurar los datos al estado exacto previo al error. ¿Qué capacidad lo permite MEJOR?","options":["Journaling de las transacciones para aplicarlas sobre el último respaldo hasta antes del error","Restaurar el snapshot tomado a las 02:00","Activar la réplica síncrona del sitio secundario","Restaurar un respaldo completo almacenado offsite"],"answer":[0],"explanation":"El journaling registra cada cambio o transacción, lo que permite reaplicar los cambios sobre el último respaldo y recuperar hasta un punto en el tiempo justo antes del incidente. El snapshot o el respaldo completo perderían más de doce horas de transacciones, y una réplica síncrona ya contendría las tablas corruptas."},{"id":"D3-044","domain":3,"objective":"3.4","type":"single","difficulty":3,"stem":"Una empresa replica en tiempo real sus servidores de archivos a un sitio secundario y considera que ya no necesita respaldos tradicionales. ¿Cuál es el problema PRINCIPAL de este enfoque ante un ataque de ransomware?","options":["La replicación copia también los archivos cifrados o corruptos al sitio secundario, por lo que se requieren copias versionadas u offline","La replicación solo protege datos en tránsito y no datos at rest","La replicación solo puede realizarse hacia un cold site","La replicación en tiempo real aumenta el RTO a varias semanas"],"answer":[0],"explanation":"La replicación mejora la disponibilidad, pero reproduce en el destino cualquier cambio, incluidos los archivos cifrados por ransomware o los borrados accidentales; por eso deben conservarse respaldos versionados, inmutables u offline. Las demás afirmaciones son falsas: la replicación mantiene copias at rest en el destino, suele dirigirse a sitios hot o warm y reduce el tiempo de recuperación."},{"id":"D3-045","domain":3,"objective":"3.4","type":"single","difficulty":1,"stem":"El generador de un centro de datos tarda unos 30 segundos en arrancar y estabilizarse tras un corte de energía eléctrica. ¿Qué componente mantiene los servidores en operación durante ese intervalo?","options":["Un segundo generador idéntico","Un UPS","Un PDU con medición","Un load balancer"],"answer":[1],"explanation":"Un UPS (sistema de alimentación ininterrumpida) entrega energía de baterías de inmediato y cubre el intervalo hasta que el generador asume la carga, o permite un apagado ordenado. Un segundo generador tendría el mismo tiempo de arranque, un PDU solo distribuye energía y un load balancer no tiene relación con el suministro eléctrico."},{"id":"D3-046","domain":3,"objective":"3.4","type":"single","difficulty":3,"stem":"Una falla en el servicio de identidad global de un proveedor de nube dejó inaccesibles las cargas de trabajo de una empresa en TODAS las regiones de ese proveedor. El CIO quiere evitar que una falla similar detenga de nuevo la operación. ¿Qué estrategia aborda MEJOR este riesgo?","options":["Distribuir las cargas en más availability zones del mismo proveedor","Aumentar la frecuencia de los snapshots en el proveedor actual","Adoptar una estrategia multi-cloud con capacidad de operar en otro proveedor","Habilitar un cold site en otra región del mismo proveedor"],"answer":[2],"explanation":"Cuando la falla afecta a todo el proveedor, la redundancia dentro del mismo proveedor (más zonas o regiones) no ayuda; multi-cloud elimina la dependencia de un solo proveedor. Los snapshots en el mismo proveedor seguirían inaccesibles, y un cold site en otra región del mismo proveedor también quedaría afectado y tardaría semanas en operar."},{"id":"D3-047","domain":3,"objective":"3.4","type":"single","difficulty":2,"stem":"Un equipo de infraestructura quiere comprobar que, al apagar deliberadamente el sitio primario, los servicios realmente conmutan al sitio secundario y siguen funcionando. ¿Qué tipo de prueba debe realizar?","options":["Tabletop exercise","Parallel processing","Failover test","Revisión documental del plan"],"answer":[2],"explanation":"Una prueba de failover transfiere realmente la operación al sistema o sitio de respaldo para verificar que la conmutación funciona. El tabletop y la revisión documental no tocan los sistemas, y el procesamiento paralelo ejecuta ambos entornos a la vez sin apagar el primario."},{"id":"D3-048","domain":3,"objective":"3.4","type":"multi","difficulty":2,"stem":"Una auditoría encontró que todos los respaldos de una empresa se guardan sin cifrar en un NAS del mismo centro de datos y con las mismas credenciales del dominio. ¿Cuáles DOS acciones mejoran MÁS la protección de los respaldos contra robo y ransomware? (Elige DOS.)","options":["Mantener una copia offsite u offline/inmutable de los respaldos","Usar la cuenta de administrador del dominio para las tareas de respaldo","Reemplazar los respaldos por replicación en tiempo real hacia el mismo NAS","Cifrar los respaldos y gestionar las claves por separado","Aumentar la frecuencia de los snapshots en el mismo NAS"],"answer":[0,3],"explanation":"El cifrado protege la confidencialidad si los medios son robados, y una copia offsite u offline/inmutable sobrevive a desastres locales y a ransomware que alcance la red. Más snapshots en el mismo NAS, credenciales de dominio compartidas o replicación al mismo equipo mantienen el punto único de compromiso."},{"id":"D3-049","domain":3,"objective":"3.4","type":"multi","difficulty":1,"stem":"Una empresa espera duplicar su número de clientes en los próximos dos años y revisa su capacity planning para mantener la resiliencia. ¿Cuáles son las TRES áreas que debe considerar? (Elige TRES.)","options":["Geolocalización","Clasificación de datos","Tokenization","Tecnología","Personas","Infraestructura"],"answer":[3,4,5],"explanation":"La planificación de capacidad evalúa si habrá suficiente personal capacitado, si la tecnología (aplicaciones, licencias, servicios) soporta la demanda y si la infraestructura (cómputo, red, energía, espacio) puede escalar. Tokenization, clasificación de datos y geolocalización son conceptos de protección de datos."},{"id":"D3-050","domain":3,"objective":"3.4","type":"match","difficulty":2,"stem":"Asigna el tipo de sitio de recuperación MÁS adecuado a cada requisito.","items":["Sistema de pagos con RTO de minutos y datos sincronizados continuamente","Archivo histórico que puede tolerar varias semanas sin servicio, con el menor costo posible","ERP con RTO de 2 días: hardware instalado, pero los datos deben restaurarse desde respaldos","Portal de comercio electrónico donde cada hora sin servicio implica pérdidas muy altas","Sistema interno de capacitación: basta con espacio, energía y climatización disponibles"],"choices":["Hot site","Warm site","Cold site"],"answer":[0,2,1,0,2],"explanation":"Un hot site está listo para operar casi de inmediato y se justifica en sistemas con RTO muy corto o alto costo por interrupción. Un warm site tiene equipo y conectividad, pero requiere restaurar datos y configurar, por lo que recupera en horas o días. Un cold site solo ofrece instalaciones básicas, es el más barato y el más lento en recuperar."},{"id":"D4-001","domain":4,"objective":"4.1","type":"single","difficulty":2,"stem":"Hace seis meses, una organización estableció una secure baseline basada en CIS Benchmarks para sus servidores Windows y la desplegó mediante GPO. Un auditor interno descubre que varios servidores tienen servicios habilitados que no forman parte de la baseline y que la baseline no refleja recomendaciones nuevas publicadas por el fabricante. ¿Qué actividad del ciclo de vida de la baseline se descuidó MÁS probablemente?","options":["Mantener la baseline (revisar periódicamente el cumplimiento y actualizarla)","Establecer la baseline (definir la configuración segura inicial)","Desplegar la baseline (aplicarla a los sistemas objetivo)","Adquirir la baseline (procurement del estándar de configuración)"],"answer":[0],"explanation":"Una baseline segura se establece, se despliega y se mantiene; el mantenimiento incluye detectar el configuration drift y actualizar la baseline con nuevas recomendaciones. La baseline sí se estableció (con CIS) y sí se desplegó (vía GPO), por lo que el fallo está en su mantenimiento. 'Adquirir' no es una fase del ciclo de vida de una baseline."},{"id":"D4-002","domain":4,"objective":"4.1","type":"single","difficulty":2,"stem":"Una empresa de agua potable opera PLCs en una red SCADA. El fabricante advierte que aplicar parches del sistema operativo anula la certificación del equipo, y los PLCs no admiten software de terceros. ¿Cuál es la MEJOR forma de reducir el riesgo para estos dispositivos?","options":["Instalar un antivirus basado en firmas directamente en cada PLC","Habilitar actualizaciones automáticas del sistema operativo en los PLCs","Segmentar la red OT de la red corporativa con un firewall y permitir solo el tráfico estrictamente necesario","Reemplazar el RTOS de los PLCs por un sistema operativo de propósito general más fácil de parchear"],"answer":[2],"explanation":"Cuando los sistemas ICS/SCADA no pueden parchearse ni ejecutar agentes, la segmentación/aislamiento de red es el control de hardening más efectivo. Instalar antivirus o habilitar actualizaciones contradice las restricciones del fabricante, y cambiar el RTOS por un SO general no es viable ni seguro en un entorno de control de procesos en tiempo real."},{"id":"D4-003","domain":4,"objective":"4.1","type":"single","difficulty":1,"stem":"Los empleados de una oficina recién inaugurada reportan zonas sin cobertura Wi-Fi, y el equipo de seguridad detectó que la señal llega con fuerza al estacionamiento público. ¿Qué debe realizar el administrador PRIMERO para corregir la ubicación y la potencia de los access points?","options":["Migrar todos los access points a WPA3-Enterprise","Un site survey para generar un heat map de cobertura","Configurar un servidor RADIUS para autenticación 802.1X","Implementar una solución MDM en los dispositivos de los empleados"],"answer":[1],"explanation":"Un site survey con heat map muestra la intensidad de la señal por zona, lo que permite ajustar la ubicación de los APs y su potencia de transmisión para eliminar zonas muertas y reducir la fuga de señal. WPA3, RADIUS y MDM mejoran la autenticación o la gestión de dispositivos, pero no resuelven problemas de cobertura ni de alcance de la señal."},{"id":"D4-004","domain":4,"objective":"4.1","type":"single","difficulty":1,"stem":"Una empresa compra y entrega a todos sus vendedores el mismo modelo de smartphone. La empresa conserva la propiedad y el control administrativo completo del equipo, pero permite que los empleados lo usen para redes sociales y aplicaciones personales. ¿Qué modelo de despliegue describe MEJOR este escenario?","options":["BYOD (Bring Your Own Device)","CYOD (Choose Your Own Device)","COPE (Corporate-Owned, Personally Enabled)","VDI (Virtual Desktop Infrastructure)"],"answer":[2],"explanation":"En COPE la organización compra, posee y administra el dispositivo, pero habilita su uso personal. En BYOD el dispositivo es del empleado; en CYOD el empleado elige de una lista de modelos aprobados (aquí todos reciben el mismo modelo sin elegir). VDI es una tecnología de escritorio virtual, no un modelo de despliegue móvil."},{"id":"D4-005","domain":4,"objective":"4.1","type":"single","difficulty":2,"stem":"Un atacante capturó el handshake de una red WPA2-Personal y lo descifró sin conexión con un ataque de diccionario. La organización migrará a WPA3-Personal. ¿Qué característica de WPA3 mitiga MEJOR este tipo de ataque?","options":["TKIP (Temporal Key Integrity Protocol)","El 4-way handshake con PSK","SAE (Simultaneous Authentication of Equals)","WPS (Wi-Fi Protected Setup)"],"answer":[2],"explanation":"WPA3-Personal reemplaza el intercambio PSK de WPA2 por SAE (handshake Dragonfly), que resiste ataques de diccionario offline y ofrece forward secrecy. TKIP es un protocolo obsoleto de WPA, el 4-way handshake con PSK es precisamente lo que el atacante explotó y WPS tiene vulnerabilidades conocidas de fuerza bruta del PIN."},{"id":"D4-006","domain":4,"objective":"4.1","type":"single","difficulty":1,"stem":"Un despacho jurídico quiere que cada empleado se autentique en la red inalámbrica con sus propias credenciales de directorio, que el acceso se revoque al dar de baja la cuenta y que se registre quién se conecta y cuándo. ¿Qué configuración cumple MEJOR estos requisitos?","options":["WPA3-Enterprise con 802.1X/EAP y un servidor RADIUS","WPA3-Personal con una passphrase larga y compleja","Filtrado de direcciones MAC en los access points","Un portal cautivo con una contraseña compartida que se rota mensualmente"],"answer":[0],"explanation":"WPA3-Enterprise con 802.1X usa un servidor AAA como RADIUS para autenticar a cada usuario contra el directorio, autorizarlo y registrar sus conexiones (accounting). WPA3-Personal y el portal cautivo con contraseña compartida no identifican a usuarios individuales, y el filtrado MAC es fácil de evadir con MAC spoofing y no ofrece accounting por usuario."},{"id":"D4-007","domain":4,"objective":"4.1","type":"single","difficulty":3,"stem":"Un analista revisa los logs del web server de una aplicación interna y encuentra la siguiente solicitud:\n```\nPOST /login HTTP/1.1\nusername=admin'--&password=x\nHTTP/1.1 302 Found  Location: /dashboard\n```\nLa aplicación ya tiene validación en JavaScript del lado del cliente. ¿Qué control debe implementar el equipo de desarrollo para corregir MEJOR esta vulnerabilidad?","options":["Reforzar las expresiones regulares de la validación en JavaScript del navegador","Firmar digitalmente el código de la aplicación (code signing)","Validación de entrada del lado del servidor y consultas parametrizadas","Configurar las cookies de sesión con los atributos Secure y HttpOnly"],"answer":[2],"explanation":"El log muestra una SQL injection exitosa que evadió la autenticación; la defensa correcta es validar la entrada en el servidor y usar consultas parametrizadas. La validación en el cliente se omite fácilmente con un proxy o enviando la solicitud directamente. Code signing garantiza integridad y origen del código, y los atributos de cookies protegen la sesión, pero ninguno impide la inyección."},{"id":"D4-008","domain":4,"objective":"4.1","type":"multi","difficulty":2,"stem":"Durante una prueba de penetración, un script inyectado mediante XSS logró leer `document.cookie`, y además la cookie de sesión se observó en texto claro en una captura de tráfico HTTP. ¿Qué atributos debe agregar el desarrollador a la cookie de sesión para mitigar AMBOS hallazgos? (Elige DOS.)","options":["Path=/","Expires con una fecha muy lejana","Domain=.empresa.com","SameSite=None","Secure","HttpOnly"],"answer":[4,5],"explanation":"HttpOnly impide que JavaScript lea la cookie, mitigando su robo vía XSS, y Secure obliga a enviarla solo por HTTPS, evitando que viaje en texto claro. Una expiración lejana alarga la ventana de abuso, un Domain amplio la expone a más subdominios, SameSite=None debilita la protección contra CSRF y Path=/ no aporta protección."},{"id":"D4-009","domain":4,"objective":"4.1","type":"single","difficulty":1,"stem":"Una empresa de software distribuye un instalador desde su sitio web. Los clientes necesitan comprobar que el archivo proviene realmente de la empresa y que no fue modificado después de su publicación. ¿Qué técnica cumple MEJOR este requisito?","options":["Análisis estático de código (SAST)","Sandboxing","Validación de entrada","Code signing"],"answer":[3],"explanation":"La firma de código usa un certificado digital del editor para garantizar autenticidad (origen) e integridad (no modificado) del ejecutable. SAST busca fallas en el código fuente durante el desarrollo, el sandboxing aísla la ejecución y la validación de entrada protege contra datos maliciosos; ninguno permite al cliente verificar el origen del archivo."},{"id":"D4-010","domain":4,"objective":"4.1","type":"match","difficulty":3,"stem":"Relaciona cada objetivo de hardening con la técnica de endurecimiento MÁS apropiada para ese escenario. Cada técnica puede usarse una vez o ninguna.","items":["Servidor IaaS en la nube con el puerto RDP abierto a 0.0.0.0/0","Router de borde administrado actualmente por Telnet desde cualquier red","Switch de acceso con puertos libres en una sala de juntas abierta a visitantes","Cámara IP (IoT) instalada con la contraseña de fábrica","Workstation de usuario donde todos los empleados tienen privilegios de administrador local"],"choices":["Deshabilitar puertos no utilizados y aplicar port security","Restringir la administración a SSH desde una red de gestión dedicada","Cambiar credenciales predeterminadas y aislar el dispositivo en una VLAN dedicada","Restringir los security groups para eliminar el acceso público a servicios de administración","Aplicar el principio de menor privilegio retirando derechos de administrador local"],"answer":[3,1,0,2,4],"explanation":"Los puertos físicos expuestos se mitigan deshabilitándolos y con port security; Telnet transmite en claro y debe sustituirse por SSH limitado a una red de gestión; los dispositivos IoT suelen comprometerse por credenciales de fábrica y deben aislarse; en IaaS los security groups controlan la exposición a Internet; y en workstations retirar el administrador local reduce el impacto del malware."},{"id":"D4-011","domain":4,"objective":"4.1","type":"multi","difficulty":2,"stem":"Una empresa adopta BYOD y usará MDM. Los empleados exigen que su información personal no sea afectada, pero la empresa debe proteger los datos corporativos si un teléfono se pierde o el empleado deja la organización. ¿Qué capacidades de MDM cumplen MEJOR ambos requisitos? (Elige DOS.)","options":["Borrado remoto completo del dispositivo (full wipe)","Permitir sideloading de aplicaciones","Deshabilitar el bloqueo de pantalla para facilitar el soporte","Borrado remoto selectivo del contenedor corporativo","Contenerización (segmentación del almacenamiento corporativo)","Habilitar tethering por Bluetooth"],"answer":[3,4],"explanation":"La contenerización separa apps y datos corporativos de los personales, y el borrado selectivo elimina solo ese contenedor ante pérdida o salida del empleado. Un full wipe destruye también los datos personales, violando el requisito de BYOD; sideloading, quitar el bloqueo de pantalla y el tethering Bluetooth aumentan el riesgo en lugar de reducirlo."},{"id":"D4-012","domain":4,"objective":"4.1","type":"single","difficulty":2,"stem":"El equipo de seguridad recibe de un proveedor nuevo un ejecutable de utilidades y quiere observar su comportamiento (archivos que crea, conexiones de red, cambios de registro) antes de permitirlo en producción, sin riesgo para la red corporativa. ¿Qué técnica es la MÁS apropiada?","options":["Ejecutarlo en un sandbox aislado","Ejecutarlo en una workstation de producción con el antivirus actualizado","Someterlo a análisis estático de código (SAST)","Verificar únicamente su firma de código"],"answer":[0],"explanation":"Un sandbox es un entorno aislado que permite ejecutar y observar el comportamiento del software sin afectar sistemas de producción. Ejecutarlo en producción expone la red aunque haya antivirus, SAST requiere código fuente y no observa comportamiento en ejecución, y una firma válida solo confirma el origen, no que el software sea benigno."},{"id":"D4-013","domain":4,"objective":"4.2","type":"single","difficulty":1,"stem":"Un año después de comprar 40 switches a un revendedor no autorizado, la empresa descubre que el fabricante ya no publica parches para ese modelo y que algunos equipos tienen firmware no oficial. ¿Qué proceso de gestión de activos debió prevenir MEJOR esta situación?","options":["Disposal/decommissioning","Enumeración de activos","Retención de datos","Adquisición/procurement"],"answer":[3],"explanation":"Durante la adquisición se deben evaluar proveedores confiables, la cadena de suministro y el soporte del fabricante durante el ciclo de vida previsto. El decomisionamiento ocurre al final de la vida útil, la enumeración descubre activos ya desplegados y la retención de datos define cuánto tiempo se conserva la información."},{"id":"D4-014","domain":4,"objective":"4.2","type":"single","difficulty":2,"stem":"Una base de datos con información de clientes no tiene un responsable definido: nadie aprueba las solicitudes de acceso ni decide su nivel de clasificación. ¿Qué rol debe asignarse para resolver MEJOR este problema?","options":["Data custodian","Data processor","Data owner","Usuario final"],"answer":[2],"explanation":"El data owner (normalmente un ejecutivo o responsable de negocio) es quien rinde cuentas por los datos, define su clasificación y aprueba el acceso. El custodian implementa y opera los controles (respaldos, permisos) según las decisiones del owner, el processor trata datos por cuenta de otro y el usuario final solo los consume."},{"id":"D4-015","domain":4,"objective":"4.2","type":"single","difficulty":2,"stem":"Una empresa aplica exactamente los mismos controles (cifrado, DLP y retención de 10 años) a todos sus archivos, incluidos menús de la cafetería y comunicados públicos. Los costos de almacenamiento y licencias se dispararon. ¿Qué acción permitiría MEJOR aplicar controles proporcionales al valor de la información?","options":["Eliminar el DLP y depender solo del cifrado","Reducir el periodo de retención de todos los archivos a un año","Implementar un esquema de clasificación de datos y asignar controles según cada nivel","Mover todos los archivos a almacenamiento en frío en la nube"],"answer":[2],"explanation":"La clasificación (por ejemplo, pública, interna, confidencial, restringida) permite asignar controles acordes a la sensibilidad y valor de cada activo, evitando sobreproteger información pública. Las demás opciones recortan controles o costos de forma indiscriminada, lo que podría dejar sin protección o sin cumplimiento la información sensible."},{"id":"D4-016","domain":4,"objective":"4.2","type":"single","difficulty":2,"stem":"Un escaneo de descubrimiento de red identificó 37 hosts activos que no aparecen en la CMDB de la organización. ¿Cuál es la implicación de seguridad PRINCIPAL de este hallazgo?","options":["Los activos no inventariados consumen direcciones IP del pool de DHCP","La CMDB debe migrarse a una plataforma en la nube","Los hosts deben destruirse físicamente de inmediato","Los activos no inventariados probablemente no reciben parches ni monitoreo, lo que amplía la superficie de ataque"],"answer":[3],"explanation":"Lo que no se conoce no se puede proteger: los activos no inventariados (shadow IT o dispositivos rogue) quedan fuera de la gestión de parches, de las baselines y del monitoreo. El consumo de IPs es un problema operativo menor, migrar la CMDB no corrige el hallazgo y destruir hosts sin investigar es desproporcionado; lo correcto es enumerarlos, identificar a su propietario e incorporarlos o retirarlos."},{"id":"D4-017","domain":4,"objective":"4.2","type":"single","difficulty":1,"stem":"En los últimos seis meses desaparecieron varias laptops corporativas y nadie puede determinar a quién estaban asignadas. ¿Qué medida ayudaría MÁS a mejorar la rendición de cuentas sobre estos activos?","options":["Emitir certificados de destrucción para cada laptop","Aplicar borrado criptográfico a todas las laptops","Definir una política de retención de datos de siete años","Etiquetar los activos, registrar su asignación a un usuario responsable y realizar auditorías periódicas de inventario"],"answer":[3],"explanation":"El asset tracking (etiquetas, inventario y asignación a un propietario) establece quién es responsable de cada equipo y permite detectar faltantes con rapidez. Los certificados de destrucción y el borrado criptográfico corresponden al decomisionamiento, y la retención de datos no tiene relación con la custodia física de los equipos."},{"id":"D4-018","domain":4,"objective":"4.2","type":"single","difficulty":3,"stem":"Una organización quiere reasignar internamente laptops con discos SSD a otro departamento. Los discos contenían información confidencial de recursos humanos y deben poder reutilizarse. ¿Qué método de sanitización es el MÁS apropiado?","options":["Desmagnetización (degaussing) del SSD","Formateo rápido del disco y reinstalación del sistema operativo","Sobrescritura de un solo paso con ceros usando una herramienta diseñada para HDD","Borrado criptográfico o el comando de secure erase/sanitize del fabricante del SSD"],"answer":[3],"explanation":"En SSD, el wear leveling y el overprovisioning impiden que la sobrescritura tradicional alcance todas las celdas; el borrado criptográfico o el secure erase/sanitize del firmware sí sanitizan todo el medio y permiten reutilizarlo. El degaussing no afecta la memoria flash, y el formateo rápido solo elimina las referencias del sistema de archivos."},{"id":"D4-019","domain":4,"objective":"4.2","type":"single","difficulty":1,"stem":"Una empresa contrata a un proveedor externo para destruir 200 discos duros retirados. El auditor de cumplimiento solicitará evidencia de que cada disco fue destruido adecuadamente. ¿Qué debe exigir la empresa al proveedor?","options":["Un certificado de destrucción con los números de serie de los discos","Un reporte de escaneo de vulnerabilidades","Un acuerdo de nivel de servicio (SLA) de soporte técnico","Una copia de la política de retención de datos del proveedor"],"answer":[0],"explanation":"El certificado de destrucción documenta qué activos se destruyeron, cuándo y con qué método, y sirve como evidencia ante auditorías. Un reporte de vulnerabilidades, un SLA de soporte o la política de retención del proveedor no demuestran la destrucción de los medios."},{"id":"D4-020","domain":4,"objective":"4.2","type":"single","difficulty":3,"stem":"El servidor de contabilidad de una empresa llegó al fin de su vida útil y será decomisionado. La regulación fiscal local exige conservar los registros contables durante cinco años. ¿Qué debe hacer el equipo de TI PRIMERO, antes de sanitizar los discos?","options":["Solicitar al proveedor de destrucción un certificado de destrucción","Verificar los requisitos de retención y archivar los datos que deban conservarse en un repositorio aprobado","Desmagnetizar los discos para eliminar cualquier dato remanente","Eliminar el servidor de la CMDB para cerrar el registro del activo"],"answer":[1],"explanation":"Antes de sanitizar, el decomisionamiento debe considerar la retención de datos (obligaciones legales, regulatorias o un legal hold); de lo contrario se destruiría información que debe conservarse. El certificado se obtiene después de la destrucción, desmagnetizar antes de archivar provocaría pérdida irreversible, y la CMDB se actualiza al final del proceso."},{"id":"D4-021","domain":4,"objective":"4.2","type":"multi","difficulty":2,"stem":"Una agencia gubernamental retira discos duros mecánicos (HDD) que almacenaron información clasificada. La política prohíbe que los discos salgan de las instalaciones en estado utilizable. ¿Qué métodos son los MÁS apropiados? (Elige DOS.)","options":["Trituración física (shredding)","Eliminar los archivos y vaciar la papelera de reciclaje","Reinstalar el sistema operativo","Desmagnetización (degaussing)","Eliminar y recrear las particiones","Formateo rápido"],"answer":[0,3],"explanation":"La trituración destruye físicamente el disco, y la desmagnetización borra los dominios magnéticos de un HDD y lo deja inservible, ambos adecuados para datos clasificados. El formateo rápido, borrar archivos, reinstalar el SO o recrear particiones dejan datos recuperables con herramientas forenses."},{"id":"D4-022","domain":4,"objective":"4.2","type":"match","difficulty":3,"stem":"Relaciona cada medio que se va a retirar o reutilizar con el método de sanitización/destrucción MÁS apropiado. Cada método puede usarse más de una vez.","items":["Lote de cientos de cintas magnéticas con datos confidenciales que deben sanitizarse rápidamente en sitio y entregarse íntegras (sin triturar) a un reciclador certificado","HDD funcional que se donará a una escuela local","Expedientes impresos de nómina","SSD funcional de una laptop que se reasignará a otro empleado","SSD dañado que ya no enciende y contiene datos de clientes"],"choices":["Sobrescritura (wiping) con herramienta certificada","Borrado criptográfico / secure erase del firmware","Desmagnetización (degaussing)","Destrucción física (trituración, pulverizado, incineración o pulpeo)"],"answer":[2,0,3,1,3],"explanation":"Un HDD que se reutilizará fuera de la organización se sanitiza con sobrescritura, conservando su funcionalidad; un SSD reutilizable requiere borrado criptográfico o secure erase por el wear leveling. Un lote grande de cintas magnéticas que debe entregarse íntegro se sanitiza de forma rápida y masiva con desmagnetización (la sobrescritura cinta por cinta sería impráctica y la trituración no está permitida), el papel se tritura o se convierte en pulpa, y un SSD que no enciende no admite comandos de borrado, por lo que debe destruirse físicamente."},{"id":"D4-023","domain":4,"objective":"4.3","type":"single","difficulty":1,"stem":"Un escáner de vulnerabilidades reporta lo siguiente para un servidor:\n```\nHost: 10.20.5.14  OS detectado: Windows Server 2022\nCritical - CVE-2021-41773 Apache HTTP Server 2.4.49 Path Traversal\n```\nEl administrador confirma que el servidor solo ejecuta IIS y que Apache nunca se ha instalado. ¿Cómo debe clasificarse este hallazgo?","options":["Falso positivo","Falso negativo","Verdadero positivo","Verdadero negativo"],"answer":[0],"explanation":"Un falso positivo ocurre cuando el escáner reporta una vulnerabilidad que en realidad no existe; aquí el software afectado ni siquiera está instalado. Un falso negativo es lo contrario (una vulnerabilidad real no detectada), un verdadero positivo sería una vulnerabilidad real reportada y un verdadero negativo es la ausencia correcta de hallazgos."},{"id":"D4-024","domain":4,"objective":"4.3","type":"single
